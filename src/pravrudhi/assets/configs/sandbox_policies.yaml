# What a sandboxed agent may touch and call, declared instead of assembled by hand.
#
# `proposal` is the shape tasks_from_plan (application/subagents.py) already builds one call at a time: a scratch
# directory under proposals/ and a compileall validate command. `selfbuild` and `review` are declared here so a
# future caller can ask for them by name instead of writing the same allowed_paths/validate pairs again.
#
# denied_paths below are additive only: sandbox_policy.Policy always merges in pravrudhi_kernel/, research/,
# gates/ and .pravrudhi/ regardless of what is written here, so a missing or mistyped entry in this file can
# never reopen them.

policies:
  proposal:
    allowed_paths: ["proposals/**"]
    denied_paths: []
    network: none
    tools: ["agent-claude-code", "agent-codex", "agent-orca", "runtime-uv"]
    max_wall_s: 1800
    validate: "uv run python -m compileall -q ."

  selfbuild:
    # Everything the engine is made of except the kernel, the evidence and its operational state (those are
    # merged in as denied whatever is written here). Widened 2026-09-11 from src+tests when build-mode
    # obligations began dispatching through this policy: a criterion about the interface, a script or a config
    # is real work too, and confining it to src/ would have produced README proposals for the rest.
    allowed_paths: ["src/pravrudhi/**", "tests/**", "app/frontend/src/**", "scripts/**", "docs/**", "configs/**", "plugin/**"]
    denied_paths: []
    network: provider-only
    tools: ["agent-claude-code", "runtime-uv", "mcp-git"]
    max_wall_s: 3600
    # The same command integrate.BUILD_VALIDATE runs in the main tree after a build-mode merge.
    validate: "uv run ruff check src tests && uv run mypy src && uv run pytest -q tests"

  review:
    allowed_paths: []
    denied_paths: []
    network: none
    tools: ["mcp-git"]
    max_wall_s: 900
    validate: "true"
