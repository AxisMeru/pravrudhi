# What each route costs and what it can do, as far as this project has measured it.
#
# Relative cost is normalised so the cheapest usable route is 1.0. It is a ratio rather than a price because prices
# change and ratios move more slowly. The Claude figures come from `total_cost_usd` in the headless client's own
# JSON envelope on an identical trivial prompt: haiku 0.0719, sonnet 0.2117. The codex figure is an estimate from
# token volume, not a reported price, and is marked as such.
#
# VERIFIED 2026-09-05, and the first attempt at this got it wrong: on this ChatGPT-backed Codex account the CLI
# accepts `gpt-6-astra` and NOTHING else. Every other name tried - gpt-6, gpt-6-mini, gpt-6-astra-mini,
# codex-mini-latest, gpt-5.1-codex, gpt-5.1-codex-mini, gpt-5-codex - is refused with
# "not supported when using Codex with a ChatGPT account". A first probe appeared to show four of them working; it
# was matching the wrong substring in the CLI's output, and two dispatches were wasted on the strength of it.
# Probe by checking for the refusal string, never by looking for a success token.
#
# The consequence is that cost cannot be managed by choosing a cheaper model on codex. It is managed by sending
# work that does not need the strongest model to Claude Code instead, where a cheaper model does exist.
updated: 2026-09-07
minimum_trials: 3
confidence: 0.95

routes:
  - id: qwen-lite-max
    agent: opencode:alibaba-plan
    model: qwen3.8-max
    relative_cost: 0.15
    tiers: [mechanical, standard]
    note: >-
      Alibaba's Lite Plan flagship, on a plan-exclusive endpoint with its own key file and a credit budget rather
      than a free-tier token cap. Verified live on 2026-09-07: given a file and a read tool it called the tool
      and returned the right answer, exit 0 in 8.6s. Admitted at the two tiers the free-tier loop was admitted
      at, on the same evidence and the same reasoning -- one verified tool call says the loop runs, not that it
      does design or critical work well. It is declared ahead of the free-tier loop because it is cheaper and the
      vendor's stronger model, and it rises further only on its measured record here.

  - id: qwen-loop
    agent: opencode:alibaba
    model: qwen3-coder-plus
    relative_cost: 0.2
    tiers: []
    note: >-
      Out of the tiers since 2026-09-08: the free tier's coding quota is spent. Asked to do work it answers
      "The free quota has been exhausted", observed through the agent rather than assumed, so it is a route the
      swarm can no longer choose. The subscribed Lite Plan (qwen-lite-max) is the Alibaba seat that works and is
      first at both tiers it serves. Kept here rather than deleted because the quota resets and the record of
      what it did is worth keeping.
      Qwen driving a real tool loop through OpenCode against DashScope Singapore. Verified live on 2026-09-07:
      given a file and a read tool it called the tool and returned the right answer, exit 0 in 8.1s at zero
      cost. An earlier attempt from inside a sandboxed agent failed at OpenCode's own log file before reaching
      DashScope, which is a property of nesting one agent inside another's sandbox and not of this route;
      agents/ALIBABA_LOOP.md keeps that transcript. Admitted at mechanical and standard because one verified
      tool call is evidence the loop runs, not evidence it does design or critical work well. It rises through
      the same measured outcomes as every other route, or it does not rise.

  - id: qwen-coder
    agent: hosted
    model: qwen3-coder-plus
    relative_cost: 0.2
    tiers: [mechanical, standard, design, critical]
    sentinel: true
    note: >-
      A hosted free-tier model with no CLI: it cannot drive a tool-calling loop, only answer once with a JSON
      payload of whole-file contents. It is the SENTINEL. Permitted at every tier but declared last everywhere
      above mechanical, so the router reaches it only when every paid route at that tier is cooling down from a
      usage limit. A single-shot writer is a poor substitute for an agent loop and a far better one than a
      stopped loop, which is what the operator asked for on 2026-09-06: the system must run unattended when the
      paid accounts are spent. It stays because the loop above it is a different route and can also be spent.

  - id: haiku
    agent: claude-code
    model: haiku
    relative_cost: 1.0
    tiers: []
    note: >-
      Cheapest route that can drive an agent loop, and demoted to no tier on the operator's instruction of
      2026-09-06 ("don't go to too basic models"): it produced nothing on the tool-registry task that sonnet's
      sibling tasks completed. Kept in the table so the router can be told to try it again deliberately.

  - id: sonnet
    agent: claude-code
    model: sonnet
    relative_cost: 2.9
    tiers: [mechanical, standard, design, critical]

  - id: opus
    agent: claude-code
    model: opus
    relative_cost: 6.9
    tiers: [design, critical]
    note: Measured 0.4951 on the same trivial prompt that cost sonnet 0.2117.

  - id: astra
    agent: codex
    model: gpt-6-astra
    relative_cost: 10.0
    tiers: [design, critical]
    note: >-
      The strongest available and the only model this account's codex will accept. Twenty sessions in one day
      consumed seven million input tokens while it was the silent default for three of the four tiers. It is no
      longer permitted below the design tier.

  - id: local-glm
    agent: orca:local
    model: glm-4.7-flash
    relative_cost: 0.0
    tiers: [mechanical]
    sentinel: true
    note: >-
      Costs nothing and, on the evidence so far, does little: it produced no change at all on two tasks a hosted
      agent completed in minutes. Serving text and driving an agentic tool-calling loop are different
      capabilities. Restored to the mechanical tier only, and declared behind sonnet, so it is
      reached solely when the paid route is cooling. Last resort, not a peer.

# Declared order decides before there is measured evidence, and it is also the tie-break the fallback path walks.
# The sentinels sit last at every tier on purpose: they take over, they do not compete.
# A tier named here takes its route from the operator rather than from the cost heuristic. Declared order only
# breaks ties before there is evidence; once a route has a track record the chooser prefers the cheapest whose
# interval overlaps the best, which is right in general and wrong when the operator has said which model should
# do this work. A preferred route still yields to the ordinary rules when it is cooling or unavailable.
prefer:
  critical: astra   # operator, 2026-09-06: "let astra handle the tough jobs"

declared:
  # The critical tier leads with astra on the operator's explicit instruction of 2026-09-06: "let astra handle
  # the tough jobs". It had been listed last there, behind opus and sonnet, which made it a last resort reached
  # only once the cheaper routes were measured worse or cooling — permitted, but never preferred, which is the
  # inverse of what was asked. Cost still governs the tiers below; this one is a stated preference, and a
  # preference outranks the cost heuristic.
  # The verified Qwen loop is declared ahead of the single-shot sentinel at the two tiers it was measured at, so
  # a spent paid account falls to a real tool loop first and to a one-shot writer only after that. Both are named
  # here rather than left to the cost sort, which ranked them by id and put the sentinel above the loop.
  mechanical: [qwen-lite-max, sonnet, local-glm]
  standard: [qwen-lite-max, sonnet]
  design: [sonnet, opus, astra]
  critical: [astra, opus, sonnet]
