# Phrases that mean "this account has hit a usage limit, try again later" for each coding agent.
#
# These are strings the vendors' own CLIs print when a rate limit or quota is exhausted, matched against an agent
# run's combined stdout/stderr case-insensitively. Matching is deliberately loose in both directions: a wrong match
# only costs an unnecessary cooldown (the route is skipped for a while and then tried again), while missing a real
# limit is worse, because it gets recorded as an ordinary loss against the route's success rate and can sink a route
# that never actually failed.
patterns:
  claude-code:
    - "usage limit reached"
    - "5-hour limit"
    - "rate_limit_error"
    - "claude usage limit"
  codex:
    - "usage limit"
    - "quota"
    - "429"
  hosted:
    - "freetieronly"
    - "exceeded your current quota"
    - "insufficient_quota"
  # The Qwen tool loop reaches DashScope through OpenCode, so both layers can report exhaustion. Without an entry
  # here a spent free tier read as an ordinary failure: the route was never cooled, the fallback chain never moved
  # past it, and the quota was recorded as a loss against a route that had not actually done anything wrong.
  opencode:alibaba:
    - "throttling"
    - "quota"
    - "429"
    - "rate limit"
    - "requests rate limit exceeded"
    - "allocated quota exceeded"
    - "arrearage"
  # The Lite Plan is a separate endpoint with its own key file and its own credit budget, so it is spent
  # independently of the free tier and needs its own entry. Sharing one would have meant exhausting the plan
  # cooled the free tier with it, and the fallback would skip a route that was still perfectly usable.
  opencode:alibaba-plan:
    - "throttling"
    - "quota"
    - "429"
    - "rate limit"
    - "requests rate limit exceeded"
    - "allocated quota exceeded"
    - "arrearage"
    - "insufficient credits"

# Minutes to wait before trying an agent again after it reports a limit. "default" applies to any agent id not
# listed by name (codex, orca:* and anything added later).
cooldown_minutes:
  default: 60
  claude-code: 300
  hosted: 60
  # DashScope's free tier resets on a short window rather than a daily one, so a shorter cooldown gets the loop
  # back into rotation without waiting out an hour it does not need.
  opencode:alibaba: 20
  # Plan credits reset on a weekly cycle rather than a short window, so a longer wait before retrying.
  opencode:alibaba-plan: 120

# Phrases that mean "the transport stumbled", as distinct from "this account is out of quota". Not keyed by agent:
# a reset connection is a property of the network, not of the vendor, and a new seat added later gets the same
# treatment without another entry here.
#
# Counted across 157 recorded outcomes on 2026-09-09, all 41 rejections were one class. A dispatch that timed out
# after 1800s was recorded as an ordinary loss against `opencode:alibaba-plan` and the fallback chain never ran,
# because only a "limited" verdict reaches it. Thirty minutes of wall clock bought nothing and the same route was
# chosen again on the next beat.
#
# Matched loosely and case-insensitively, like the limit patterns. A wrong match costs one dispatch on a different
# route; a missed one costs a route's reputation for a fault that was never its fault.
transient:
  - "connection reset"
  - "econnreset"
  - "etimedout"
  - "econnrefused"
  - "enotfound"
  - "socket hang up"
  - "fetch failed"
  - "timeout after"
  - "timed out"
  - "502"
  - "503"
  - "504"
  - "bad gateway"
  - "service unavailable"
  - "gateway timeout"
  - "upstream connect error"
  - "temporarily unavailable"
  - "internal server error"

# How long to hold a seat that merely stumbled. Far shorter than a quota cooldown: the account is fine, so holding
# it out for an hour would throw away a working route over one bad connection.
transient_cooldown_minutes: 2
