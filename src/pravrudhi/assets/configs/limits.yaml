# Phrases that mean "this account has hit a usage limit, try again later" for each coding agent.
#
# These are strings the vendors' own CLIs print when a rate limit or quota is exhausted, matched against an agent
# run's combined stdout/stderr case-insensitively. Matching is deliberately loose in both directions: a wrong match
# only costs an unnecessary cooldown (the route is skipped for a while and then tried again), while missing a real
# limit is worse, because it gets recorded as an ordinary loss against the route's success rate and can sink a route
# that never actually failed.
patterns:
  claude-code:
    - "usage limit reached"
    - "5-hour limit"
    - "rate_limit_error"
    - "claude usage limit"
  codex:
    - "usage limit"
    - "quota"
    - "429"
  hosted:
    - "freetieronly"
    - "exceeded your current quota"
    - "insufficient_quota"
  # The Qwen tool loop reaches DashScope through OpenCode, so both layers can report exhaustion. Without an entry
  # here a spent free tier read as an ordinary failure: the route was never cooled, the fallback chain never moved
  # past it, and the quota was recorded as a loss against a route that had not actually done anything wrong.
  opencode:alibaba:
    - "throttling"
    - "quota"
    - "429"
    - "rate limit"
    - "requests rate limit exceeded"
    - "allocated quota exceeded"
    - "arrearage"
  # The Lite Plan is a separate endpoint with its own key file and its own credit budget, so it is spent
  # independently of the free tier and needs its own entry. Sharing one would have meant exhausting the plan
  # cooled the free tier with it, and the fallback would skip a route that was still perfectly usable.
  opencode:alibaba-plan:
    - "throttling"
    - "quota"
    - "429"
    - "rate limit"
    - "requests rate limit exceeded"
    - "allocated quota exceeded"
    - "arrearage"
    - "insufficient credits"

# Minutes to wait before trying an agent again after it reports a limit. "default" applies to any agent id not
# listed by name (codex, orca:* and anything added later).
cooldown_minutes:
  default: 60
  claude-code: 300
  # A SEAT is held out separately from the vendor (`claude-code:<seat id>`, see `configs/seats.yaml`), so one
  # spent seat does not take Claude out of rotation while the reserve is still there. Both were falling
  # through to `default: 60` because neither key was listed; declared here at the value that was already in
  # force, so the window is chosen rather than inherited by accident.
  #
  # Shorter than the vendor's 300 on purpose. A seat that has actually stated a return time is held until
  # then (`mark_limited(until=...)`) and this window never applies; it is the guess for when the CLI says it
  # is limited without saying until when, and guessing short costs one skipped dispatch while guessing long
  # leaves a recovered seat idle for hours.
  claude-code:primary: 60
  claude-code:fallback: 60
  hosted: 60
  # DashScope's free tier resets on a short window rather than a daily one, so a shorter cooldown gets the loop
  # back into rotation without waiting out an hour it does not need.
  opencode:alibaba: 20
  # Plan credits reset on a weekly cycle rather than a short window, so a longer wait before retrying.
  opencode:alibaba-plan: 120

# Phrases that mean "the transport stumbled", as distinct from "this account is out of quota". Not keyed by agent:
# a reset connection is a property of the network, not of the vendor, and a new seat added later gets the same
# treatment without another entry here.
#
# Counted across 157 recorded outcomes on 2026-09-09, all 41 rejections were one class. A dispatch that timed out
# after 1800s was recorded as an ordinary loss against `opencode:alibaba-plan` and the fallback chain never ran,
# because only a "limited" verdict reaches it. Thirty minutes of wall clock bought nothing and the same route was
# chosen again on the next beat.
#
# Matched loosely and case-insensitively, like the limit patterns. A wrong match costs one dispatch on a different
# route; a missed one costs a route's reputation for a fault that was never its fault.
transient:
  - "connection reset"
  - "econnreset"
  - "etimedout"
  - "econnrefused"
  - "enotfound"
  - "socket hang up"
  - "fetch failed"
  - "timeout after"
  - "timed out"
  - "502"
  - "503"
  - "504"
  - "bad gateway"
  - "service unavailable"
  - "gateway timeout"
  - "upstream connect error"
  - "temporarily unavailable"
  - "internal server error"

# How long to hold a seat that merely stumbled. Far shorter than a quota cooldown: the account is fine, so holding
# it out for an hour would throw away a working route over one bad connection.
transient_cooldown_minutes: 2

# A cooldown longer than this is re-tried once it has run this long, then again after another such span: the
# vendor's stated return time is what it said at the moment of failure, and a quota reset early on the console
# (2026-09-11: the Lite Plan was reset by hand while the router held "2026-09-14T16:14Z" it had parsed days before)
# would otherwise be masked until the stale timestamp passed. The retry costs at most one ordinary dispatch per
# span, which re-marks the route from the vendor's fresh answer if the limit still stands.
reprobe_hours: 6

# What the heartbeat's own reprobe (`availability.reprobe_cooling`, driven from `pravrudhi heartbeat`) asks a
# cooling route directly, and how long it waits for an answer. Kept to the single cheapest possible exchange: the
# point of asking on a schedule rather than waiting for an ordinary dispatch to land on the route is to spend as
# little as the question itself costs, not a whole task's worth of tokens.
reprobe_prompt: "Reply with the single word ok."
reprobe_timeout_s: 60

# S6: how wide one obligations beat may go. `next_unmet` always names the single oldest open request, so a hard
# one could monopolise every beat for hours while 500+ other criteria waited (S5's own survey: 13 of 22 beats
# on 2026-09-12 spent on one request, zero progress, zero others touched). `concurrent_dispatches` lets a beat
# pick up to this many INDEPENDENT criteria - different requests, path-disjoint - and dispatch them together in
# one wave (`swarm.run_wave` already parallelises a wave; nothing here invents new isolation).
#
# `min_available_gb` is the safety valve, not a suggestion: this box has run under earlyoom pressure all
# morning, and each concurrent dispatch spawns its own coding-agent process plus its MCP/plugin servers. Read
# fresh every beat against /proc/meminfo's MemAvailable; below the floor (or if it cannot even be measured) the
# beat narrows to one dispatch, exactly as it always has.
heartbeat:
  concurrent_dispatches: 2
  min_available_gb: 6
