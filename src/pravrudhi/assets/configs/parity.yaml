# Rival claims await verified product sources. Matrix order breaks next_gap ties.
# OpenClaw was assessed on 2026-09-08 by reading its source at
# /home/ss/gb10-archive/openclaw_build/swarm-platform — its modules, API routes, React dashboard pages and
# components — not by reputation. Until then every row read `unknown`, which the completion gate's adversarial
# reviewer correctly called out: the operator named OpenClaw as a rival twice and no row had ever looked at it.
#
# What the reading found, so the verdicts below are legible rather than asserted. OpenClaw is a server plus a
# web dashboard for a multi-agent swarm. It is strong exactly where that shape is strong — dispatch,
# orchestration, parallel worktrees, running arbitrary coding agents, operations and metrics surfaces, and
# messaging, which it treats as a first-class page rather than an afterthought. It has no Electron anywhere, so
# every desktop- and editor-shaped row is a genuine `none` rather than an unexamined one.
#
# Two things it has that are worth taking rather than merely beating: an autonomous loop that executes
# (autonomousLoop.js) where this engine's heartbeat only chooses, and a per-agent communication trace
# (AgentCommunicationTrace.tsx) showing what agents said to each other, which this engine does not surface.
rows:
- id: command-palette
  capability: Keyboard command palette
  why_it_matters: Reach actions without navigating the sidebar.
  rivals:
    orca: unknown
    claude_desktop: unknown
    codex: unknown
    openclaw: none  # no palette in ui/src; navigation is page links
  ours: have
  evidence:
    - 'command: grep -qF CommandPalette app/frontend/src/app/layout.tsx'
    - 'command: grep -qF metaKey app/frontend/src/components/palette/CommandPalette.tsx'
  notes: Mounted globally in the root layout; opens on Ctrl+K or Cmd+K and searches pages, actions and records.
    Recorded as absent when this matrix was seeded because the layout was not inspected; the evidence is
    re-run on every check, which is what caught it.
- id: dispatch
  capability: Dispatch and monitor agent work
  why_it_matters: Start work and see whether it is running.
  rivals:
    orca: unknown
    claude_desktop: unknown
    codex: unknown
    openclaw: have  # orchestrator.js, coordinator.js, queueManager.js, routes/agents.js
  ours: have
  evidence:
  - 'command: grep -qF "<DispatchPanel />" app/frontend/src/app/swarm/page.tsx'
  - app/frontend/src/components/swarm/DispatchPanel.tsx
  notes: Source-level panel presence; does not prove successful dispatch on a configured host.
- id: sandbox-monitor
  capability: Sandbox monitoring
  why_it_matters: Inspect confinement and violations alongside work.
  rivals:
    orca: unknown
    claude_desktop: unknown
    codex: unknown
    openclaw: partial  # openclawRunner.js sandboxes runs; OpsPage and LogViewerPanel show them
  ours: have
  evidence:
  - 'command: grep -qF "<SandboxesSection />" app/frontend/src/app/swarm/page.tsx'
  - app/frontend/src/components/sandboxes/SandboxesSection.tsx
  notes: Source-level monitor presence. NemoClaw monitor vocabulary includes health, logs and policy denials;
    this is not evidence that standalone OpenClaw provides the same sandbox monitor.
- id: diff-viewer
  capability: Review task diffs
  why_it_matters: Inspect changes before accepting agent work.
  rivals:
    orca: unknown
    claude_desktop: unknown
    codex: unknown
    openclaw: none  # diffs are internal to worktreeManager.js; no viewer in the dashboard
  ours: have
  evidence:
  - 'command: grep -qF "<DiffViewer" app/frontend/src/app/diffs/page.tsx'
  - app/frontend/src/components/diffs/DiffViewer.tsx
  notes: Source-level task selection and diff renderer; no live task result asserted.
- id: streaming-chat
  capability: Streaming conversational interface
  why_it_matters: Receive progress while an answer is produced.
  rivals:
    orca: unknown
    claude_desktop: unknown
    codex: unknown
    openclaw: none  # WebSocket carries agent events; AgentCommunicationTrace observes, no chat
  ours: partial
  evidence:
  - 'command: grep -qF "text/event-stream" src/pravrudhi/api/chat.py'
  - 'command: grep -qF "function* chatStream" app/frontend/src/lib/api.ts'
  - app/frontend/e2e/local-engine.spec.ts
  notes: >-
    The server streams and the client now reads the body incrementally rather than awaiting the whole response.
    Still partial because the end-to-end test has not passed. This machine has no chat model configured, so
    /api/chat answers 503 and the test cannot observe any tokens at all. The test asserts the answer was seen
    growing at least twice, since a blocking response yields exactly one observation and would satisfy a weaker
    bar. It stays partial until it runs green against a configured model.
- id: notifications
  capability: Operator notifications
  why_it_matters: Notice completed work without polling a work panel.
  rivals:
    orca: unknown
    claude_desktop: unknown
    codex: unknown
    openclaw: have  # telegramRelay.js and a TelegramPage in the dashboard
  ours: have
  evidence:
  - 'command: grep -qF "<NotificationBell />" app/frontend/src/components/Sidebar.tsx'
  - app/frontend/src/components/notifications/NotificationBell.tsx
  - tests/test_messaging.py
  - 'command: grep -qF a_workspace_never_reaches_the_operators_environment tests/test_messaging.py'
  - app/frontend/src/app/settings/page.tsx
  notes: The in-app bell is mounted, and a notification is also delivered to Telegram - the operator's engine
    through its own environment, a user's workspace through a bot they add in settings, and never one through
    the other. OS notifications are still not claimed.
- id: desktop-shell
  capability: Native desktop shell
  why_it_matters: Keep the local engine in a dedicated application window.
  rivals:
    orca: unknown
    claude_desktop: unknown
    codex: unknown
    openclaw: none  # no electron anywhere in the tree
  ours: have
  evidence:
  - app/desktop/package.json
  - app/desktop/smoke.js
  - app/desktop/build-macos.sh
  - app/desktop/install-macos.sh
  - app/desktop/install-linux.sh
  - app/desktop/electron-builder.product.json
  - app/desktop/electron-builder.studio.json
  - docs/DESKTOP.md
  - app/frontend/src/app/desktop/page.tsx
  - app/desktop/test/edition.test.js
  - 'command: grep -qF shellStale app/desktop/renderer/app.js'
  - 'command: grep -q windows-latest .github/workflows/release.yml'
  notes: >-
    Run rather than read, and now as two installs. Studio and the product are separate builds with their own
    appId, product name, output directory and per-user data directory, so both sit on one machine without
    overwriting each other, and each carries an edition file the app reads and passes to every engine it
    starts. Both were installed on Linux and on the Mac mini, and each reported launched, engine found, health
    ok, no errors, and the edition it was built as, against an engine it started itself. Unit tests cover port
    selection, process ownership, teardown, the edition rule and the two build configurations.
    Three caveats stay in view. Windows is built by release CI and has never been launched, so nothing here
    claims it runs; the Linux launch passes --no-sandbox because that machine's Electron sandbox helper needs
    root; and the macOS build is unsigned and not notarized, which is fine for the operator's own machines and
    not for distribution.
- id: system-page
  capability: System health and agent overview
  why_it_matters: Understand the engine and available builders.
  rivals:
    orca: unknown
    claude_desktop: unknown
    codex: unknown
    openclaw: have  # OpsPage, SystemStatusBar, MetricsPanel
  ours: have
  evidence:
  - 'command: grep -qF "<SwarmPanel />" app/frontend/src/app/system/page.tsx'
  - 'command: grep -qF "<HealthPanel" app/frontend/src/app/system/page.tsx'
  notes: Source-level System page; actual health depends on live data.
# Orca's own twelve advertised capabilities, taken from the feature wall its installed AppImage ships in
# resources/onboarding/feature-wall (each tile names its source recording and the date it was made). Every
# orca: have below is that list, not an impression of it.
#
# The eight rows still reading `orca: unknown` are the ones where this engine has something Orca does not
# advertise, and they are exactly the rows that would substantiate "richer than Orca". They were probed on
# 2026-09-08 against the installed AppImage's bundle and the probe was not good enough to record: narrow
# patterns returned zero for streaming, sandbox, health and queueing, and broader ones returned hundreds of
# hits for all four. The first result was evidence about the pattern, not about Orca. Substring counts in a
# minified bundle cannot tell a product surface from an internal helper, so the column stays unknown.
#
# What the board therefore says today, plainly: ahead of Orca on nothing assessed, level on eight, behind on
# four, and eight never checked. It does not support a claim of being richer, and filling the column on the
# strength of grep counts would make it worthless — which is the whole reason it exists.
- id: parallel-worktrees
  capability: Parallel agents in isolated worktrees
  why_it_matters: Run several agents at once without them overwriting each other.
  # openclaw (have): worktreeManager.js
  rivals: {orca: have, claude_desktop: unknown, codex: unknown, openclaw: have}
  ours: have
  evidence:
  - src/pravrudhi/application/delegate.py
  - src/pravrudhi/application/integrate.py
  - 'command: grep -qF -e --3way src/pravrudhi/application/integrate.py'
  notes: Both isolate agents per worktree. Ours also merges them three-way per file and names a contested file
    rather than letting the last writer win, which was added after five silent overwrites in one day.
- id: embedded-terminal
  capability: Embedded terminal emulator
  why_it_matters: Run and watch a command without leaving the application.
  # openclaw (none): terminal appears only in server.js logging
  rivals: {orca: have, claude_desktop: unknown, codex: unknown, openclaw: none}
  ours: partial
  evidence:
  - app/frontend/src/components/terminal/RunTerminal.tsx
  - app/frontend/src/lib/terminal.ts
  - 'command: grep -qF api/runs/ app/frontend/src/lib/terminal.ts'
  notes: >-
    A run's output streams into the interface as it happens, over the same server-sent events the engine already
    publishes, with scrollback and follow-the-tail. Partial rather than have, and deliberately so: it accepts no
    typed input. A shell in a web page is a remote execution surface and this engine's threat model does not
    have one, so the gap against Orca here is a decision rather than unfinished work.
- id: github-integration
  capability: GitHub repository and pull request integration
  why_it_matters: Review and land work without switching to a browser.
  # openclaw (partial): referenced from DashboardPage.tsx only
  rivals: {orca: have, claude_desktop: unknown, codex: unknown, openclaw: partial}
  ours: partial
  evidence:
  - src/pravrudhi/application/updates.py
  notes: GitHub is reached only to check for releases. There is no repository browsing, issue or pull request
    surface.
- id: any-cli-agent
  capability: Drive any command line agent
  why_it_matters: Use the agent that suits the task rather than the one the app ships with.
  # openclaw (have): openclawRunner.js runs coding agents under a policy
  rivals: {orca: have, claude_desktop: unknown, codex: unknown, openclaw: have}
  ours: have
  evidence:
  - src/pravrudhi/agents/registry.py
  - src/pravrudhi/agents/cli_agents.py
  - src/pravrudhi/agents/orca_agent.py
  notes: Five backends resolve on this machine, and one of them drives Orca itself. Routing picks between them
    from measured outcomes rather than a fixed preference.
- id: design-mode
  capability: Direct visual editing of an interface
  why_it_matters: Change a layout by pointing at it instead of describing it.
  # openclaw (none): nothing in ui/src
  rivals: {orca: have, claude_desktop: unknown, codex: unknown, openclaw: none}
  ours: none
  evidence: []
  notes: Not built and not currently planned. Listed so the gap is visible rather than absent.
- id: ssh-remote
  capability: Work on a remote machine over SSH
  why_it_matters: Use the machine that has the hardware.
  # openclaw (partial): ssh referenced in server.js; no remote-host surface in the dashboard
  rivals: {orca: have, claude_desktop: unknown, codex: unknown, openclaw: partial}
  ours: have
  evidence:
  - src/pravrudhi/hosts/transports.py
  - src/pravrudhi/hosts/fleet.py
  notes: Hosts are surveyed for accelerator, memory and installed agents, so a task can be placed on a machine
    that can actually run it.
- id: file-drag
  capability: Drag a file into the conversation
  why_it_matters: Attach context without typing a path.
  # openclaw (none): nothing in ui/src
  rivals: {orca: have, claude_desktop: unknown, codex: unknown, openclaw: none}
  ours: have
  evidence:
  - app/frontend/src/components/chat/ChatDropTarget.tsx
  - app/frontend/src/lib/attachments.ts
  - 'command: grep -qF ChatDropTarget app/frontend/src/app/chat/page.tsx'
  notes: >-
    A file dropped on the composer is read in the browser and its text folded into the message, since this engine
    has no upload route and none was added. The limits are therefore the whole of the protection and are stated
    as named constants with their reasons: 256 KB a file, 512 KB in total, four at once, text and source formats
    only. Every refusal carries its own sentence rather than failing silently.

    The evidence names the page as well as the components, deliberately. They existed for a while mounted on
    nothing, exactly as the command palette once did, and this row stayed at none for as long as that was true.
- id: diff-annotation
  capability: Annotate a generated diff
  why_it_matters: Say what is wrong with a change at the line it is wrong on.
  # openclaw (none): nothing in ui/src
  rivals: {orca: have, claude_desktop: unknown, codex: unknown, openclaw: none}
  ours: have
  evidence:
  - app/frontend/src/components/diffs/DiffViewer.tsx
  - app/frontend/src/components/diffs/Annotations.tsx
  - app/frontend/src/components/diffs/annotations.spec.ts
  notes: >-
    A note attaches to a file and line of a task's diff, several to a line, and the set for a task reads as a
    whole because the reason to write them is to hand them to someone. They live in the browser: an annotation
    is one reviewer's working note, the engine has no route to store one, and a blocked storage API degrades to
    notes that last the session rather than breaking the page.
- id: command-line
  capability: A command line for the whole product
  why_it_matters: Script the tool and use it over a plain SSH session.
  # openclaw (partial): shell scripts (run-swarm.sh, smoke.sh), not a command surface
  rivals: {orca: have, claude_desktop: unknown, codex: unknown, openclaw: partial}
  ours: have
  evidence:
  - src/pravrudhi/cli/app.py
  - 'command: grep -qF @app.command src/pravrudhi/cli/app.py'
  notes: Thirty-two commands, covering the whole loop rather than a chat wrapper.
- id: keyboard-native
  capability: Keyboard-driven navigation throughout
  why_it_matters: Work without reaching for the pointer.
  # openclaw (none): nothing in ui/src
  rivals: {orca: have, claude_desktop: unknown, codex: unknown, openclaw: none}
  ours: have
  evidence:
  - 'command: grep -qF metaKey app/frontend/src/components/palette/CommandPalette.tsx'
  - 'command: grep -qF KeyboardShortcuts app/frontend/src/app/layout.tsx'
  - app/frontend/src/components/keyboard/dismiss.spec.ts
  notes: Ctrl+K opens the palette over pages, actions and records; digits 1-9 reach the sidebar directly; "/"
    focuses the page's own input; "?" lists every shortcut; Escape closes the topmost layer only, which is the
    part with a test rather than a screenshot. A key pressed while typing is left to the field it was typed into.
- id: account-switching
  capability: Switch between provider accounts
  why_it_matters: Separate work from personal quota, and survive one account being rate limited.
  # openclaw (partial): auth.js exists; no account switcher in the dashboard
  rivals: {orca: have, claude_desktop: unknown, codex: unknown, openclaw: partial}
  ours: partial
  evidence:
  - src/pravrudhi/application/credentials.py
  notes: Keys can be supplied per provider and are stored outside the work tree at 0600. There is no notion of
    two accounts for one provider, and no switch in the interface.
- id: markdown-editor
  capability: Edit a document in the application
  why_it_matters: Keep notes and plans where the work is.
  # openclaw (none): markdown only in evaluator and telegram relay output
  rivals: {orca: have, claude_desktop: unknown, codex: unknown, openclaw: none}
  ours: have
  evidence:
  - 'command: grep -qF a_note_can_be_written_corrected_and_deleted_over_the_api tests/test_api_and_product.py'
  - 'command: grep -qF onSave={saveNote} app/frontend/src/app/memory/page.tsx'
  notes: A note is written, corrected in place and deleted, with a Markdown source/preview editor over a
    renderer whose escaping and scheme allowlist are tested as attacks. The claim is the round trip rather than
    the widget - the editor existed for a while with its Save button wired to nothing, which is why the evidence
    is the API test and the page's handler rather than the component's presence.
# The five rows below were added on 2026-09-08 because the matrix had none. Every one of the twenty rows above
# describes an IDE surface — a palette, a diff pane, a terminal, a shortcut — which is the category Orca competes
# in and wins: of the twelve rows where Orca has been assessed it has all twelve. Nothing in the matrix mentioned
# a night, a ledger, a route chosen from measured outcomes, a candidate or its ancestry, so the one product claim
# the engine can actually support had no row to stand on and the board could only ever read as a loss.
#
# Orca was recorded `unknown` on these rows for one day, on the honest ground that grepping a minified bundle for
# identifiers proves nothing when a minifier may have renamed them. That objection does not apply to the bundle's
# own chunk filenames: Orca 1.4.197 ships 828 named renderer modules and 15 named main-process modules, and those
# names come from the source tree at build time. Across all 843 there is no module for a ledger, evidence, a
# night, a benchmark, an evaluation, a candidate, provenance, an appetite, a budget or agent routing. The only
# `lineage` module is `worktree-lineage-projection`, the sidebar's parent/child tree of git worktrees, which is a
# different subject wearing the same word. Named-module absence across a whole product is evidence; identifier
# absence inside minified function bodies is not, which is why the first pass stopped short and this one does not.
#
# `unattended-nights` is Orca `partial` rather than `none`, and the distinction is the point of the row. Orca has
# `AutomationsPage`, `automation-host-client` and `automation-precheck`, so it genuinely runs work unattended.
# What it has no module for is a declared appetite or budget bounding that work. Running unattended is half the
# capability; running unattended inside a stated bound is the half this row is about.
- id: measured-routing
  capability: Choose the agent and model from measured outcomes
  why_it_matters: Spend on the expensive route only once the evidence distinguishes it from a cheaper one.
  # orca (unknown): no successRate/wilson/trials/successes identifier anywhere in the minified bundle
  rivals: {orca: none, claude_desktop: unknown, codex: unknown, openclaw: unknown}
  ours: have
  evidence:
  - 'command: grep -qF "def choose(" src/pravrudhi/application/routing.py'
  - 'command: grep -qF wilson src/pravrudhi/application/routing.py'
  notes: A route is picked as the cheapest whose Wilson interval upper bound still reaches the best route's lower
    bound, so a cheap route is kept until the log can actually tell them apart. The claim is the rule and its
    recorded outcomes, not that the ranking is correct - on 2026-09-08 the Lite Plan seat stood at two successes
    in six trials, an interval of 0.10 to 0.70, which distinguishes it from nothing yet.
- id: evidence-ledger
  capability: Every stated number traces to an append-only ledger row
  why_it_matters: A result that cannot be replayed from its own record is a claim, not a measurement.
  rivals: {orca: none, claude_desktop: unknown, codex: unknown, openclaw: unknown}
  ours: have
  evidence:
  - pravrudhi_kernel/src/pravrudhi_kernel/ledger/writer.py
  - 'command: grep -qF "def verify(" pravrudhi_kernel/src/pravrudhi_kernel/ledger/verify.py'
  - 'command: grep -qF "def replay(" pravrudhi_kernel/src/pravrudhi_kernel/ledger/replay.py'
  notes: The ledger is written once and verified as a chain, and replay folds it back into the state a night saw.
    The scope is the mechanism; it does not assert that every surface in the product reads from it.
- id: search-ancestry
  capability: Read back the parent structure of the search
  why_it_matters: Without ancestry an evolutionary arm has nothing to shrink toward and no novelty to reward.
  # orca (unknown): its `lineage` modules are worktree-tree projections, a different subject
  rivals: {orca: none, claude_desktop: unknown, codex: unknown, openclaw: unknown}
  ours: have
  evidence:
  - 'command: grep -qF "def parent_map(" src/pravrudhi/application/archive.py'
  - 'command: grep -qF "def ancestry_report(" src/pravrudhi/application/archive.py'
  notes: The lineage field was written on every proposal from the start and read by nothing. Folded, the committed
    ledger gives 189 candidates, two distinct parents and a maximum depth of two - a two-node star, which is
    recorded here as the shape the search currently has rather than as an achievement.
- id: selection-pressure
  capability: Report whether the budget forced a choice at all
  why_it_matters: A selection rule earns nothing on a night when everything proposed could be afforded.
  rivals: {orca: none, claude_desktop: unknown, codex: unknown, openclaw: unknown}
  ours: have
  evidence:
  - 'command: grep -qF "def selection_pressure(" src/pravrudhi/application/archive.py'
  notes: Per night, the live pool against what was run. On the committed ledger the budget bound on seven of
    sixteen nights, so on the other nine the controller ranked a set it was going to run in full. This row exists
    to keep that measurable; it is the least flattering number the engine reports about itself.
- id: unattended-nights
  capability: Run unattended within a declared appetite
  why_it_matters: Improvement that needs an operator present is not improvement the operator can leave running.
  # openclaw (partial): autonomousLoop.js executes, but spending is not bounded by a declared appetite
  rivals: {orca: partial, claude_desktop: unknown, codex: unknown, openclaw: partial}
  ours: have
  evidence:
  - 'command: grep -qF "def run_night(" src/pravrudhi/application/night.py'
  - src/pravrudhi/assets/configs/appetite.yaml
  notes: A night proposes, measures and prunes without intervention, and the drives that choose what to do next
    are weighted by a checked-in appetite policy an operator can override per workspace. The claim is that it
    runs unattended and bounded, not that any given night improved anything.
