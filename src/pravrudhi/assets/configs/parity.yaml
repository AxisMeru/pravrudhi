# Rival claims await verified product sources. Matrix order breaks next_gap ties.
rows:
- id: command-palette
  capability: Keyboard command palette
  why_it_matters: Reach actions without navigating the sidebar.
  rivals:
    orca: unknown
    claude_desktop: unknown
    codex: unknown
    openclaw: unknown
  ours: have
  evidence:
    - 'command: grep -qF CommandPalette app/frontend/src/app/layout.tsx'
    - 'command: grep -qF metaKey app/frontend/src/components/palette/CommandPalette.tsx'
  notes: Mounted globally in the root layout; opens on Ctrl+K or Cmd+K and searches pages, actions and records.
    Recorded as absent when this matrix was seeded because the layout was not inspected; the evidence is
    re-run on every check, which is what caught it.
- id: dispatch
  capability: Dispatch and monitor agent work
  why_it_matters: Start work and see whether it is running.
  rivals:
    orca: unknown
    claude_desktop: unknown
    codex: unknown
    openclaw: unknown
  ours: have
  evidence:
  - 'command: grep -qF "<DispatchPanel />" app/frontend/src/app/swarm/page.tsx'
  - app/frontend/src/components/swarm/DispatchPanel.tsx
  notes: Source-level panel presence; does not prove successful dispatch on a configured host.
- id: sandbox-monitor
  capability: Sandbox monitoring
  why_it_matters: Inspect confinement and violations alongside work.
  rivals:
    orca: unknown
    claude_desktop: unknown
    codex: unknown
    openclaw: unknown
  ours: have
  evidence:
  - 'command: grep -qF "<SandboxesSection />" app/frontend/src/app/swarm/page.tsx'
  - app/frontend/src/components/sandboxes/SandboxesSection.tsx
  notes: Source-level monitor presence. NemoClaw monitor vocabulary includes health, logs and policy denials;
    this is not evidence that standalone OpenClaw provides the same sandbox monitor.
- id: diff-viewer
  capability: Review task diffs
  why_it_matters: Inspect changes before accepting agent work.
  rivals:
    orca: unknown
    claude_desktop: unknown
    codex: unknown
    openclaw: unknown
  ours: have
  evidence:
  - 'command: grep -qF "<DiffViewer" app/frontend/src/app/diffs/page.tsx'
  - app/frontend/src/components/diffs/DiffViewer.tsx
  notes: Source-level task selection and diff renderer; no live task result asserted.
- id: streaming-chat
  capability: Streaming conversational interface
  why_it_matters: Receive progress while an answer is produced.
  rivals:
    orca: unknown
    claude_desktop: unknown
    codex: unknown
    openclaw: unknown
  ours: partial
  evidence:
  - 'command: grep -qF "text/event-stream" src/pravrudhi/api/chat.py'
  - 'command: grep -qF "function* chatStream" app/frontend/src/lib/api.ts'
  - app/frontend/e2e/local-engine.spec.ts
  notes: >-
    The server streams and the client now reads the body incrementally rather than awaiting the whole response.
    Still partial because the end-to-end test has not passed. This machine has no chat model configured, so
    /api/chat answers 503 and the test cannot observe any tokens at all. The test asserts the answer was seen
    growing at least twice, since a blocking response yields exactly one observation and would satisfy a weaker
    bar. It stays partial until it runs green against a configured model.
- id: notifications
  capability: Operator notifications
  why_it_matters: Notice completed work without polling a work panel.
  rivals:
    orca: unknown
    claude_desktop: unknown
    codex: unknown
    openclaw: unknown
  ours: have
  evidence:
  - 'command: grep -qF "<NotificationBell />" app/frontend/src/components/Sidebar.tsx'
  - app/frontend/src/components/notifications/NotificationBell.tsx
  notes: In-app bell is mounted; external messaging and OS notifications are not claimed.
- id: desktop-shell
  capability: Native desktop shell
  why_it_matters: Keep the local engine in a dedicated application window.
  rivals:
    orca: unknown
    claude_desktop: unknown
    codex: unknown
    openclaw: unknown
  ours: have
  evidence:
  - app/desktop/package.json
  - app/desktop/smoke.js
  - app/desktop/build-macos.sh
  - app/desktop/install-macos.sh
  - docs/DESKTOP.md
  - app/frontend/src/app/desktop/page.tsx
  notes: >-
    Run rather than read, and now on both platforms. On Linux the smoke launch starts the shell, which picks a
    free port, starts an engine, loads the interface and reports the window title, then exits leaving no engine
    behind. On macOS the packaged arm64 build was installed to the Mac mini's ~/Applications and its smoke run
    reported launched, engine found and health ok with no errors, against an engine it started itself. Unit
    tests cover port selection, process ownership and teardown. Two caveats stay in view. The Linux launch
    passes --no-sandbox because that machine's Electron sandbox helper needs root, and the macOS build is
    unsigned and not notarized, which is fine for the operator's own machines and not for distribution.
- id: system-page
  capability: System health and agent overview
  why_it_matters: Understand the engine and available builders.
  rivals:
    orca: unknown
    claude_desktop: unknown
    codex: unknown
    openclaw: unknown
  ours: have
  evidence:
  - 'command: grep -qF "<SwarmPanel />" app/frontend/src/app/system/page.tsx'
  - 'command: grep -qF "<HealthPanel" app/frontend/src/app/system/page.tsx'
  notes: Source-level System page; actual health depends on live data.
# Orca's own twelve advertised capabilities, taken from the feature wall its installed AppImage ships in
# resources/onboarding/feature-wall (each tile names its source recording and the date it was made). Every
# orca: have below is that list, not an impression of it. The other three rivals stay unknown because nothing
# comparable has been inspected for them, and guessing would make the whole table worthless.
- id: parallel-worktrees
  capability: Parallel agents in isolated worktrees
  why_it_matters: Run several agents at once without them overwriting each other.
  rivals: {orca: have, claude_desktop: unknown, codex: unknown, openclaw: unknown}
  ours: have
  evidence:
  - src/pravrudhi/application/delegate.py
  - src/pravrudhi/application/integrate.py
  - 'command: grep -qF -e --3way src/pravrudhi/application/integrate.py'
  notes: Both isolate agents per worktree. Ours also merges them three-way per file and names a contested file
    rather than letting the last writer win, which was added after five silent overwrites in one day.
- id: embedded-terminal
  capability: Embedded terminal emulator
  why_it_matters: Run and watch a command without leaving the application.
  rivals: {orca: have, claude_desktop: unknown, codex: unknown, openclaw: unknown}
  ours: partial
  evidence:
  - app/frontend/src/components/terminal/RunTerminal.tsx
  - app/frontend/src/lib/terminal.ts
  - 'command: grep -qF api/runs/ app/frontend/src/lib/terminal.ts'
  notes: >-
    A run's output streams into the interface as it happens, over the same server-sent events the engine already
    publishes, with scrollback and follow-the-tail. Partial rather than have, and deliberately so: it accepts no
    typed input. A shell in a web page is a remote execution surface and this engine's threat model does not
    have one, so the gap against Orca here is a decision rather than unfinished work.
- id: github-integration
  capability: GitHub repository and pull request integration
  why_it_matters: Review and land work without switching to a browser.
  rivals: {orca: have, claude_desktop: unknown, codex: unknown, openclaw: unknown}
  ours: partial
  evidence:
  - src/pravrudhi/application/updates.py
  notes: GitHub is reached only to check for releases. There is no repository browsing, issue or pull request
    surface.
- id: any-cli-agent
  capability: Drive any command line agent
  why_it_matters: Use the agent that suits the task rather than the one the app ships with.
  rivals: {orca: have, claude_desktop: unknown, codex: unknown, openclaw: unknown}
  ours: have
  evidence:
  - src/pravrudhi/agents/registry.py
  - src/pravrudhi/agents/cli_agents.py
  - src/pravrudhi/agents/orca_agent.py
  notes: Five backends resolve on this machine, and one of them drives Orca itself. Routing picks between them
    from measured outcomes rather than a fixed preference.
- id: design-mode
  capability: Direct visual editing of an interface
  why_it_matters: Change a layout by pointing at it instead of describing it.
  rivals: {orca: have, claude_desktop: unknown, codex: unknown, openclaw: unknown}
  ours: none
  evidence: []
  notes: Not built and not currently planned. Listed so the gap is visible rather than absent.
- id: ssh-remote
  capability: Work on a remote machine over SSH
  why_it_matters: Use the machine that has the hardware.
  rivals: {orca: have, claude_desktop: unknown, codex: unknown, openclaw: unknown}
  ours: have
  evidence:
  - src/pravrudhi/hosts/transports.py
  - src/pravrudhi/hosts/fleet.py
  notes: Hosts are surveyed for accelerator, memory and installed agents, so a task can be placed on a machine
    that can actually run it.
- id: file-drag
  capability: Drag a file into the conversation
  why_it_matters: Attach context without typing a path.
  rivals: {orca: have, claude_desktop: unknown, codex: unknown, openclaw: unknown}
  ours: none
  evidence: []
  notes: No drop target anywhere in the interface.
- id: diff-annotation
  capability: Annotate a generated diff
  why_it_matters: Say what is wrong with a change at the line it is wrong on.
  rivals: {orca: have, claude_desktop: unknown, codex: unknown, openclaw: unknown}
  ours: have
  evidence:
  - app/frontend/src/components/diffs/DiffViewer.tsx
  - app/frontend/src/components/diffs/Annotations.tsx
  - app/frontend/src/components/diffs/annotations.spec.ts
  notes: >-
    A note attaches to a file and line of a task's diff, several to a line, and the set for a task reads as a
    whole because the reason to write them is to hand them to someone. They live in the browser: an annotation
    is one reviewer's working note, the engine has no route to store one, and a blocked storage API degrades to
    notes that last the session rather than breaking the page.
- id: command-line
  capability: A command line for the whole product
  why_it_matters: Script the tool and use it over a plain SSH session.
  rivals: {orca: have, claude_desktop: unknown, codex: unknown, openclaw: unknown}
  ours: have
  evidence:
  - src/pravrudhi/cli/app.py
  - 'command: grep -qF @app.command src/pravrudhi/cli/app.py'
  notes: Thirty-two commands, covering the whole loop rather than a chat wrapper.
- id: keyboard-native
  capability: Keyboard-driven navigation throughout
  why_it_matters: Work without reaching for the pointer.
  rivals: {orca: have, claude_desktop: unknown, codex: unknown, openclaw: unknown}
  ours: partial
  evidence:
  - 'command: grep -qF metaKey app/frontend/src/components/palette/CommandPalette.tsx'
  notes: The palette opens on Ctrl+K and reaches pages, actions and records. Beyond it the interface expects a
    pointer, and no other shortcut has been exercised.
- id: account-switching
  capability: Switch between provider accounts
  why_it_matters: Separate work from personal quota, and survive one account being rate limited.
  rivals: {orca: have, claude_desktop: unknown, codex: unknown, openclaw: unknown}
  ours: partial
  evidence:
  - src/pravrudhi/application/credentials.py
  notes: Keys can be supplied per provider and are stored outside the work tree at 0600. There is no notion of
    two accounts for one provider, and no switch in the interface.
- id: markdown-editor
  capability: Edit a document in the application
  why_it_matters: Keep notes and plans where the work is.
  rivals: {orca: have, claude_desktop: unknown, codex: unknown, openclaw: unknown}
  ours: none
  evidence: []
  notes: Memory notes are recorded and displayed but not editable in place.
