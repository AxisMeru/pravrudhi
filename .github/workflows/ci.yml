name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Belt and braces (Lead-2, 2026-09-26): three direct-to-main pushes (4861672, ef37cc8, 89c8eb4) were found
  # here with zero associated pull requests, all pre-dating branch protection. Branch protection now blocks
  # a direct push outright, so this can't recur -- but it mirrors prabhasa-nyaya's own main-push-has-pr job
  # anyway, so a push that somehow lands (a settings change, an admin override elsewhere) is still visible
  # rather than silent.
  main-push-has-pr:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: every new commit on main must have an associated PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          BAD=0
          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "first push to this ref, nothing to diff against"
            exit 0
          fi
          for sha in $(git rev-list "$BEFORE_SHA..${{ github.event.after }}"); do
            count=$(gh api "repos/${{ github.repository }}/commits/$sha/pulls" --jq 'length')
            if [ "$count" = "0" ]; then
              echo "commit $sha has no associated pull request"
              BAD=1
            fi
          done
          exit "$BAD"

  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.13" }
      - run: uv sync --all-groups --frozen
      # mypy before pytest (Lead-2, 2026-09-26 audit, same #74 pattern): it ran after pytest here, so a
      # failing pytest step silently skipped the type check too.
      - run: uv run mypy pravrudhi_kernel/src
      - run: uv run pytest pravrudhi_kernel/tests -q --cov=pravrudhi_kernel --cov-fail-under=80

  # ADR-0052: the kernel's ledger writer imported `fcntl` unconditionally, so the whole CLI (which imports it
  # transitively) could not even start on Windows. This job installs both workspace packages (pravrudhi,
  # pravrudhi_kernel) on a Windows runner and proves the import path and the kernel's own tests survive there.
  windows-import-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.13" }
      - run: uv sync --all-groups --frozen
      - run: uv run pravrudhi --version
      - run: uv run pytest pravrudhi_kernel/tests -q

  # Builds the REAL pinned prabhasa-nyaya Lean `score` binary so `engine`'s pytest step can run every
  # requires_score_bin-gated registry/pin test for real, instead of the silent 100%-skip CI has had since
  # those tests were written (Lead-2, 2026-09-26: CI never set PRABHASA_NYAYA_SCORE_BIN anywhere -- grepped
  # every workflow, zero hits). A separate job, not steps folded into `engine`, so the deploy-key secret is
  # scoped to exactly the steps that need it and never touches `engine`'s own environment at all.
  #
  # Security (required, non-negotiable): the secret is used only when this job's own `if:` is true -- a push
  # to this repo, or a pull_request whose head repo IS this repo (never a fork). This is checked explicitly
  # here rather than relied on implicitly: GitHub already withholds repo secrets from a fork's `pull_request`
  # event by default, but that default is not what gates this job -- the job-level `if:` below is, so nothing
  # about workflow structure (a future `pull_request_target` trigger, a workflow_run chain) can silently
  # widen who this ever runs for. Never `pull_request_target`.
  build-lean-binary:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.13" }
      - run: uv sync --all-groups --frozen

      - name: read the pinned prabhasa-nyaya commit from configs/nyaya_agent.yaml's own pin comment
        id: pin
        run: echo "commit=$(uv run python scripts/extract_pinned_score_bin_commit.py)" >> "$GITHUB_OUTPUT"

      - name: clone prabhasa-nyaya at that exact commit (read-only deploy key, SSH)
        env:
          DEPLOY_KEY: ${{ secrets.PRABHASA_NYAYA_DEPLOY_KEY }}
        # runner.temp (not /tmp): a plain destination-path issue was rejected on the first real run (this
        # job had never actually cloned anything until cf4a325 landed), so a first fix moved the clone off
        # the shared, sticky-bit /tmp -- that alone did not fix it. The real bug (found on the SECOND real
        # run, dbdf47a): `umask 177` below is set to keep the deploy-key file 600, but a umask is
        # shell-wide and stays in effect for the rest of the script -- including the `git clone` a few
        # lines later. With umask 177, git's own `mkdir` for the destination directory (and for `.git`
        # inside it) gets mode 600: no execute bit, so nothing can be created inside it at all. That is
        # exactly the "Invalid path '<path>/.git': Permission denied" git reports -- a plain EACCES on
        # directory creation, not an auth or destination-path problem. Fix: restore the default umask
        # (022) immediately after the key file is written, before anything else creates a directory.
        run: |
          set -euo pipefail
          KEY_FILE="$(mktemp)"
          cleanup() { rm -f "$KEY_FILE"; }
          trap cleanup EXIT
          umask 177
          printf '%s\n' "$DEPLOY_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          umask 022
          export GIT_SSH_COMMAND="ssh -i $KEY_FILE -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --filter=blob:none git@github.com:AxisMeru/prabhasa-nyaya.git "$RUNNER_TEMP/prabhasa-nyaya"
          git -C "$RUNNER_TEMP/prabhasa-nyaya" checkout --detach "${{ steps.pin.outputs.commit }}"
          # The key file is also removed by the trap above on any exit path (success or failure); this
          # explicit rm is redundant on the happy path but costs nothing and removes any doubt.
          rm -f "$KEY_FILE"

      # Same install command prabhasa-nyaya's own CI uses (its .github/workflows/ci.yml), not a
      # separately-guessed one -- elan itself then reads $RUNNER_TEMP/prabhasa-nyaya/lean/lean-toolchain
      # and fetches the pinned Lean toolchain named there on first `lake build` below.
      - name: install elan (Lean toolchain manager)
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/v4.2.4/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: lake build
        working-directory: ${{ runner.temp }}/prabhasa-nyaya/lean
        run: lake build

      - name: verify the built binary's sha256 against pinned_score_sha256 -- fail loud on any mismatch
        run: uv run python scripts/verify_score_bin_sha.py "$RUNNER_TEMP/prabhasa-nyaya/lean/.lake/build/bin/score"

      - uses: actions/upload-artifact@v4
        with:
          name: prabhasa-nyaya-score-bin
          path: ${{ runner.temp }}/prabhasa-nyaya/lean/.lake/build/bin/score
          retention-days: 1

  # CI ordering hole (Tag, 2026-09-26): these were steps in `engine`, AFTER its pytest step. A `run:` step
  # that fails stops the rest of that job's steps by default, so all five were silently SKIPPED whenever
  # pytest failed -- exactly when someone is pushing fast and least likely to notice a skipped guard. Its
  # own job, independent of pytest and of build-lean-binary, so a red pytest run never hides a real guard
  # failure. Make this a required check in the repo's branch protection settings.
  # Companion to `guards`' range-scoped trailer check (Lead-2, 2026-09-26): the range-scoped check only
  # catches a trailer in the commits a given PR/push actually introduces -- it can't catch one that lands
  # some other way (a manual push before branch protection existed, a future settings lapse, anything this
  # repo's own CI didn't see at the time). This job re-scans main's ENTIRE history on every push to main, so
  # a trailer that slipped through by any mechanism is still caught, not silently accepted forever. NOT
  # claimed exhaustive: a scan only proves what it actually found today, never that nothing else is out
  # there -- state a reason for each allowlist entry instead of a summary claim of completeness.
  #
  # push-to-main only, no workflow_dispatch here (Lead-2 + Tag, 2026-09-27): a dispatchable trigger on THIS
  # workflow let a workflow_dispatch run's SKIPPED `guards` job satisfy `guards` as a required status
  # context -- a real bypass of branch protection. The on-demand canary now lives in its own separate
  # workflow, `history-trailer-canary.yml`, whose only job shares no name with anything required here.
  main-history-trailer-scan:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: no attribution trailers anywhere in main's full history (except the allowlist below)
        run: |
          # Split by mechanism, each with its own reason -- not one undifferentiated list.
          #
          # Agent-written trailers in a squash body (added by an agent following a harness attribution
          # reminder without checking this repo's no-trailer house rule first):
          AGENT_WRITTEN=(
            "dbdf47a989634e1a4800d0b4209f4470daf62299"
            "e57f0ae8585ad774540ec4e430a0eca7c00472dc"
            "09c0c334c1a643c5e8899152ab6bea2e958b8198"
          )
          # GitHub-composed Co-authored-by (GitHub itself composes this on a squash merge when the PR
          # opener differs from the commits' authors -- fixed going forward per TEAM-RULES.md Merging:
          # rebase-merge when possible, else an explicit trailer-free commit_message):
          GITHUB_COMPOSED=(
            "5bdc4e4bc2d0fefede2543e3a51b1baf5cf08bc7"
          )
          ALLOWLISTED_SHAS=("${AGENT_WRITTEN[@]}" "${GITHUB_COMPOSED[@]}")
          # Direct shallow-clone guard (Lead-2, 2026-09-27, R1 finding on #77): the actual regression this
          # job exists to catch is a shallow checkout, so check for that directly instead of only inferring
          # it from a commit count. The count floor below is the backstop, not the primary guard.
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            echo "checkout is shallow -- full-history scan cannot run, refusing to pass"
            exit 1
          fi
          # Pinned floor (Lead-2, 2026-09-27, corrected after R1 caught the original 109 as wrong by ~9x):
          # main had 955 commits at #77's true merge-base 73936b3 (`git rev-list --count origin/main` run
          # there), 959 on main as of this fix. Valid only because history on protected main only grows --
          # never derived from the checkout itself, that would be circular with the shallow-clone guard
          # above. Printing the scanned count and refusing anything under this floor catches a future
          # regression of the exact #74 shape (a shallow clone silently checking almost nothing) by count,
          # not just by re-reading the fetch-depth line and trusting it's still there.
          PINNED_MIN_COMMITS=955
          BAD=0
          SCANNED=0
          while read -r sha; do
            SCANNED=$((SCANNED + 1))
            skip=0
            for allowed in "${ALLOWLISTED_SHAS[@]}"; do
              [[ "$sha" == "$allowed" ]] && skip=1 && break
            done
            [[ "$skip" == 1 ]] && continue
            if git log -1 --format=%B "$sha" | grep -qiE '^(Co-Authored-By|Claude-Session):'; then
              echo "attribution trailer found in commit $sha, not on the allowlist"
              BAD=1
            fi
          done < <(git log --format=%H)
          echo "full-history scan: $SCANNED commit(s) scanned (pinned floor: $PINNED_MIN_COMMITS)"
          if [ "$SCANNED" -lt "$PINNED_MIN_COMMITS" ]; then
            echo "scanned fewer commits ($SCANNED) than the pinned floor ($PINNED_MIN_COMMITS) -- the scan is shallower than expected, refusing to pass"
            exit 1
          fi
          exit "$BAD"

  guards:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 (Tag, 2026-09-26): the trailer check below used to run `git log --format=%H` over
      # "history", but actions/checkout's default is a depth-1 shallow clone -- that grep saw exactly ONE
      # commit, the one being tested, so the check was never really scanning history at all. Full depth is
      # needed now that the check below is range-scoped (a range still needs the endpoints and everything
      # between them to be fetched).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.13" }
      - run: uv sync --all-groups --frozen
      - run: uv run python scripts/import_guard.py
      - run: uv run python scripts/check_no_private_data.py
      # 2026-09-26 incident backstop: an undeclared ARG GITHUB_TOKEN masked a silently-unauthenticated
      # Docker build for every prior release, and the fix-attempt (declaring it) leaked the real token value
      # in cleartext in the build log. This makes that class of mistake fail CI instead of a human review.
      - run: uv run python scripts/check_no_secret_dockerfile_args.py
      # Fail-open defaults (operator, 2026-09-26, after the sweep of both repos): a missing, empty or
      # unparseable verdict/confidence/score that defaults to a NUMBER instead of to None or an error, so an
      # item that could not be scored silently counts as a pass. Rules 1 and 3 fail the build; rule 2 is
      # advisory and never does (measured ~30% false positives even scoped to scorers -- see the script's
      # own docstring for the per-rule rates). The occurrences that predate this guard are listed, each with
      # a reason and an issue, in scripts/fail_open_defaults_baseline.txt; they are findings going to their
      # owners, not things this step's own PR fixed.
      - run: uv run python scripts/check_fail_open_defaults.py
      # Uncollected test files (2026-09-26): a PR added a 221-line `test_*.py` that sat outside the
      # configured test root, so pytest never collected it -- the collected count was byte-identical to the
      # base branch and the job went green on a file that contributed exactly zero tests. This guard fails
      # when a test file is in the tree but outside the roots `testpaths` names, unless it is allowlisted
      # with a written reason in scripts/uncollected_tests_allowlist.txt (which ships EMPTY: a real scan of
      # main found zero pre-existing offenders in this repo -- see that file's header).
      #
      # In THIS job, never in `engine`, for the reason this job exists at all (#74): a guard placed after
      # `engine`'s pytest step is silently skipped whenever pytest fails, and "pytest is red so nobody
      # noticed the new tests were never collected" is precisely the situation this has to survive. It has
      # no dependency on tests having run -- it reads `git ls-files` and the pytest configuration only.
      #
      # It reads the roots from pyproject.toml's `testpaths` on every run and never hardcodes them: this
      # repo has TWO (`tests` and `pravrudhi_kernel/tests`, run by `engine` and `kernel` respectively), and
      # assuming `tests` alone already produced one false CI-coverage alarm here.
      - run: uv run python scripts/check_uncollected_tests.py
      # Contract classification (Lead-2, 2026-09-27, P2 hardening of the registry-to-gate coupling): every id
      # in the pinned registry must be in EXACTLY ONE of `validated_contracts:` and
      # `unvalidated_contracts_documented:`, the latter carrying a one-line reason per entry. Neither list and
      # both lists are each a hard failure, so a pin bump cannot merge until somebody classifies the new ids
      # on purpose.
      #
      # IN THIS JOB, NOT `engine` (deliberate): `guards` is a required status context and `engine` is not
      # today, so the existing registry-coupling tests in `engine`'s pytest step do not actually gate a
      # merge -- that split is on the morning list as a branch-protection item. A pure static script belongs
      # here anyway, for the reason this job exists at all (#74): no pytest dependency, no application import
      # (KNOWN_CONTRACT_IDS is read with `ast`, like scripts/import_guard.py does), so a PR pushed at speed
      # with a red pytest is still covered.
      #
      # Fail-closed on every input: a missing, empty or unparseable config / registry / pinned count / digest
      # seal FAILS, and the registry id count is an EXACT equality against `pinned_registry_count:` in
      # configs/nyaya_agent.yaml (a floor would silently accept a registry that shrank). A green line here
      # prints the three counts it examined, so a pass over nothing is visible in the log.
      - run: uv run python scripts/check_contract_classification.py
      # Secret scanning over THIS PR'S DIFF (operator ask, 2026-09-26, after that morning's Docker ARG
      # token leak and the 2026-09-11 Telegram bot token). In THIS job rather than `engine` for the reason
      # this job exists at all (#74): it is a pure static check with no dependency on tests having run, and
      # a PR being pushed at speed with a red pytest is exactly the case a secrets guard must still cover.
      #
      # It COMPLEMENTS check_no_secret_dockerfile_args.py two steps above rather than repeating it: that
      # guard catches a secret-shaped DECLARATION in a Dockerfile (`ARG GITHUB_TOKEN`), the shape that
      # leaked into the build log; this one catches a VALUE -- a token pasted into a test, a notebook, a
      # README, a JSON blob or a YAML file, none of which the Dockerfile guard can see.
      #
      # What it does NOT do, so nobody reads more into a green tick than is there: it scans the DIFF, so a
      # secret already on main is in no later PR's diff and will never be found here (the guard's
      # `--all-tracked` mode is the sweep for that, an audit someone runs rather than a gate), and nothing
      # in CI can remove a secret from published history -- the only remedy for a real hit is rotation. It
      # never prints a matched value: the log gets a path, a line, a rule and a redacted fingerprint,
      # because this log is readable by everyone who can see the run.
      #
      # The `unshallow` step below is separate, and additive, on purpose: this job's checkout is left
      # exactly as #74 wrote it. actions/checkout defaults to depth 1, which has no origin/main and no
      # HEAD~1 to diff against; the guard's answer to "no base" is a whole-tree audit rather than a vacuous
      # pass -- correct, but wider and slower than this gate is meant to be.
      #
      # SECRET_SCAN_BEFORE is used only on a `push` event; on a pull_request the guard reads GitHub's own
      # GITHUB_BASE_REF. Measured over the merged tree before landing: 25 raw hits, 23 of them pattern
      # defects that were fixed (unquoted code right-hand sides, tokeniser `*_token_id` names, env-var
      # NAMES and file paths held in credential-named constants), and the last 2 -- one constructed test
      # string on two lines of tests/test_nyaya_judges.py -- waived by digest in
      # scripts/secret_scan_baseline.txt with a written reason.
      - name: deepen the checkout so the secret scan has a base commit to diff against
        run: git fetch --no-tags --prune --unshallow origin || git fetch --no-tags --prune origin
      - run: uv run python scripts/check_no_secrets_in_diff.py
        env:
          SECRET_SCAN_BEFORE: ${{ github.event.before }}
      # Lead-2, 2026-09-26: dbdf47a carries a Co-Authored-By trailer -- added by an agent following a
      # harness attribution reminder without checking this repo's own house rule first (that rule
      # overrides any harness default: no Co-Authored-By/Claude-Session trailer in these repos, ever).
      # It's already pushed to main; Lead-2's decision is (b) -- no force-push of main, ever, full stop --
      # so known offenders are allowlisted by exact sha, everything else stays strictly checked. Root cause
      # (separately fixed): .githooks/commit-msg, which strips this trailer automatically, only runs when
      # core.hooksPath is set to .githooks in the committing checkout -- it wasn't, for these commits'
      # authors. Run `git config core.hooksPath .githooks` in every checkout/worktree you commit from.
      # Historical offenders (found while this check still did a full-history scan, now retired -- see
      # below): e57f0ae ("Judge concurrency", PR #9), 09c0c33 ("Second-judge REFER band", PR #8), and
      # 5bdc4e4 (Tag's #65 squash-merge: GitHub composed a Co-authored-by line itself from the PR's own
      # commits; Lead-2's decision, 2026-09-26: allowlist it, no rewrite of a protected main, and
      # squash-merges from now on pass an explicit commit_title/commit_message with no trailers via the
      # API so GitHub can't compose one -- see TEAM-RULES.md Merging).
      #
      # Range-scoped, not full-history (Tag, 2026-09-26): the old version re-scanned the ENTIRE `git log`
      # on every run, which (a) needed an ever-growing allowlist for old, already-merged commits and (b)
      # combined with the missing fetch-depth above, was accidentally checking almost nothing. Checking
      # just the commits that are actually new -- the PR's own range on a pull_request event, the pushed
      # range (including the squash result) on a push to main -- means a commit merged once and found
      # clean (or allowlisted) never needs re-checking, and the allowlist above only exists for the record,
      # not because these commits are still in scope.
      #
      # Moved here from `governance` (Lead-2, 2026-09-26, same fix as #74): it ran after that job's own
      # pytest step, so a failing `uv run pytest tests/governance -q` silently skipped it too.
      - name: no attribution trailers in the commits this run actually introduces
        env:
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Third branch (Lead-2, 2026-09-27): a pull_request or a push with a real BEFORE_SHA both give a
          # genuine range to diff. A push with an empty/all-zeros before (a branch's first push, nothing to
          # diff against) has no range at all -- falling through to `git rev-list ..<sha>` there would
          # silently scan nothing while still exiting 0. Instead this branch does a full-history scan
          # against the same allowlist mechanism-split as main-history-trailer-scan, and asserts it actually
          # saw at least one commit; zero commits scanned is a hard failure here, never a silent pass. This
          # workflow accepts only push/pull_request (2026-09-27: workflow_dispatch was removed after Tag
          # found it let a workflow_dispatch run's SKIPPED `guards` satisfy a required status context --
          # see history-trailer-canary.yml, a separate workflow with no job sharing this repo's required
          # check names), so in practice this branch is only ever reached by the empty-before case.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="$BASE_SHA..$HEAD_SHA"
          elif [ "${{ github.event_name }}" = "push" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] && [ -n "$BEFORE_SHA" ]; then
            RANGE="$BEFORE_SHA..${{ github.sha }}"
          else
            echo "no range available (event=${{ github.event_name }}, before=${BEFORE_SHA:-<empty>}) -- falling back to a full-history scan"
            AGENT_WRITTEN=(
              "dbdf47a989634e1a4800d0b4209f4470daf62299"
              "e57f0ae8585ad774540ec4e430a0eca7c00472dc"
              "09c0c334c1a643c5e8899152ab6bea2e958b8198"
            )
            GITHUB_COMPOSED=(
              "5bdc4e4bc2d0fefede2543e3a51b1baf5cf08bc7"
            )
            ALLOWLISTED_SHAS=("${AGENT_WRITTEN[@]}" "${GITHUB_COMPOSED[@]}")
            SCANNED=0
            BAD=0
            while read -r sha; do
              [ -z "$sha" ] && continue
              SCANNED=$((SCANNED + 1))
              skip=0
              for allowed in "${ALLOWLISTED_SHAS[@]}"; do
                [[ "$sha" == "$allowed" ]] && skip=1 && break
              done
              [[ "$skip" == 1 ]] && continue
              if git log -1 --format=%B "$sha" | grep -qiE '^(Co-Authored-By|Claude-Session):'; then
                echo "attribution trailer found in commit $sha, not on the allowlist"
                BAD=1
              fi
            done < <(git log --format=%H)
            echo "full-history fallback scanned $SCANNED commit(s)"
            [ "$SCANNED" -lt 1 ] && { echo "scanned zero commits -- refusing to pass silently"; exit 1; }
            exit "$BAD"
          fi
          BAD=0
          SCANNED=0
          while read -r sha; do
            [ -z "$sha" ] && continue
            SCANNED=$((SCANNED + 1))
            if git log -1 --format=%B "$sha" | grep -qiE '^(Co-Authored-By|Claude-Session):'; then
              echo "attribution trailer found in commit $sha"
              BAD=1
            fi
          done < <(git rev-list "$RANGE")
          echo "range scan ($RANGE) scanned $SCANNED commit(s)"
          [ "$SCANNED" -lt 1 ] && { echo "the range held zero commits -- refusing to pass silently"; exit 1; }
          exit "$BAD"

  engine:
    runs-on: ubuntu-latest
    needs: [build-lean-binary]
    # Runs regardless of build-lean-binary's outcome (success, failure, OR skipped -- a fork PR skips that
    # job entirely, by design): the pytest step below still runs either way, and
    # check_score_bin_gate_ran.py is the permanent backstop that makes the difference visible rather than
    # silent -- green with the real binary available, red (as designed, see that script's own docstring)
    # without it.
    if: "!cancelled()"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.13" }
      - run: uv sync --all-groups --frozen
      - run: uv run ruff check pravrudhi_kernel src tests scripts
      - run: uv run mypy src
      - name: download the real Lean binary (absent on a fork PR or a failed build -- pytest below still runs)
        if: needs.build-lean-binary.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: prabhasa-nyaya-score-bin
          path: /tmp/score-bin
      - name: mark the downloaded binary executable
        if: needs.build-lean-binary.result == 'success'
        run: chmod +x /tmp/score-bin/score
      - name: pytest (with the real Lean binary when build-lean-binary produced one)
        env:
          PRABHASA_NYAYA_SCORE_BIN: /tmp/score-bin/score
        run: uv run pytest tests -q
      # Permanent backstop (Lead-2, 2026-09-26): fails if not one requires_score_bin-gated test actually
      # executed. Green whenever build-lean-binary supplied a real, pin-verified binary above; red on a fork
      # PR or if that job ever fails -- both cases where the registry/pin tests genuinely did not run here,
      # which is exactly what this exists to make impossible to miss.
      #
      # env is required here (Lead-2-assistant, 2026-09-26): e6b9d70's debug step proved
      # PRABHASA_NYAYA_SCORE_BIN was correctly set and the file genuinely existed for the pytest step right
      # above -- 3104 passed there. This step runs its own separate pytest.main() in-process
      # (check_score_bin_gate_ran.py), but as its own workflow step it never inherited an env: block, so its
      # in-process pytest saw no PRABHASA_NYAYA_SCORE_BIN at all and every requires_score_bin test skipped
      # from ITS point of view alone -- nothing to do with whether the real pytest run above actually ran
      # them (it did).
      - run: uv run python scripts/check_score_bin_gate_ran.py
        env:
          PRABHASA_NYAYA_SCORE_BIN: /tmp/score-bin/score

  # The local-engine e2e project starts a real engine and drives the real interface. Nothing ran it: pages.yml
  # runs only --project=deployed and this file had no Playwright at all, so when the front door was reworked and
  # its heading renamed, the test asserting the old name stayed red and unnoticed.
  #
  # Scoped to the page-rendering tests, which need no model. The chat-streaming test in the same file requires a
  # reachable completion endpoint, and a CI runner has none; including it would make this job fail for a reason
  # that says nothing about the change under test.
  live-interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.13" }
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - run: uv sync --all-groups --frozen
      - name: build the interface the engine serves
        working-directory: app/frontend
        # A sign-in page needs a Supabase project named at build time to render its form at all; these two are
        # public, inert values so the page has a form for the guards to check (nothing is called until submit).
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
        run: |
          npm ci
          npm run build
      - name: frontend lint stays clean
        working-directory: app/frontend
        run: npx eslint . --max-warnings=0
      - name: install playwright browsers
        working-directory: app/frontend
        run: npx playwright install --with-deps chromium firefox
      - name: every page renders on a real engine, in both engines
        working-directory: app/frontend
        run: npx playwright test --project=local-engine-chromium --project=local-engine-firefox --grep "renders its own live page"
      # Edition separation on live engines of BOTH editions (ADR-0049; the 2026-09-11 desktop review found the two
      # editions to be one interface with a stale filter). The webServer above is Studio; a second engine is
      # started here as the product edition from the same checkout, since edition is an environment variable.
      - name: the product edition hides and gates Studio's pages; Studio keeps them
        working-directory: app/frontend
        run: |
          PRAVRUDHI_EDITION=product ../../.venv/bin/python -m pravrudhi app --root ../.. --no-browser --port 8138 --host 127.0.0.1 > /tmp/product-engine.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8138/api/health > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8138/api/me
          LOCAL_ENGINE_URL=http://127.0.0.1:8138 npx playwright test --project=edition-chromium
          PRAVRUDHI_EDITION=studio ../../.venv/bin/python -m pravrudhi app --root ../.. --no-browser --port 8139 --host 127.0.0.1 > /tmp/studio-engine.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8139/api/health > /dev/null && break; sleep 1; done
          LOCAL_ENGINE_URL=http://127.0.0.1:8139 npx playwright test --project=edition-chromium

  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.13" }
      - run: uv sync --all-groups --frozen
      # 2026-09-14: v0.5.20 shipped with pyproject.toml bumped but uv.lock never regenerated in the same
      # commit, so every uv sync/uv run against main re-derived the newer version locally and dirtied
      # uv.lock for anyone syncing this repo - including the studio loop's rebase-before-beat, which parked
      # for hours on a wall that only `uv lock` could clear. `--frozen` above is what let this land in the
      # first place: it trusts the lockfile as-is and never checks it against pyproject.toml, so CI stayed
      # green through the drift. `--check` is the opposite: it fails loudly if the two disagree, without
      # writing anything, so this catches the exact mismatch before it merges rather than after every clone.
      - run: uv lock --check
      - run: uv run pytest tests/governance -q
      # The attribution-trailer history check moved to `guards` (Lead-2, 2026-09-26, same fix as #74): it
      # ran here, after this job's own pytest step, so a failing `uv run pytest tests/governance -q` would
      # have silently skipped it too.
