name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.13" }
      - run: uv sync --all-groups --frozen
      - run: uv run pytest pravrudhi_kernel/tests -q --cov=pravrudhi_kernel --cov-fail-under=80
      - run: uv run mypy pravrudhi_kernel/src

  # ADR-0052: the kernel's ledger writer imported `fcntl` unconditionally, so the whole CLI (which imports it
  # transitively) could not even start on Windows. This job installs both workspace packages (pravrudhi,
  # pravrudhi_kernel) on a Windows runner and proves the import path and the kernel's own tests survive there.
  windows-import-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.13" }
      - run: uv sync --all-groups --frozen
      - run: uv run pravrudhi --version
      - run: uv run pytest pravrudhi_kernel/tests -q

  # Builds the REAL pinned prabhasa-nyaya Lean `score` binary so `engine`'s pytest step can run every
  # requires_score_bin-gated registry/pin test for real, instead of the silent 100%-skip CI has had since
  # those tests were written (Lead-2, 2026-09-26: CI never set PRABHASA_NYAYA_SCORE_BIN anywhere -- grepped
  # every workflow, zero hits). A separate job, not steps folded into `engine`, so the deploy-key secret is
  # scoped to exactly the steps that need it and never touches `engine`'s own environment at all.
  #
  # Security (required, non-negotiable): the secret is used only when this job's own `if:` is true -- a push
  # to this repo, or a pull_request whose head repo IS this repo (never a fork). This is checked explicitly
  # here rather than relied on implicitly: GitHub already withholds repo secrets from a fork's `pull_request`
  # event by default, but that default is not what gates this job -- the job-level `if:` below is, so nothing
  # about workflow structure (a future `pull_request_target` trigger, a workflow_run chain) can silently
  # widen who this ever runs for. Never `pull_request_target`.
  build-lean-binary:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.13" }
      - run: uv sync --all-groups --frozen

      - name: read the pinned prabhasa-nyaya commit from configs/nyaya_agent.yaml's own pin comment
        id: pin
        run: echo "commit=$(uv run python scripts/extract_pinned_score_bin_commit.py)" >> "$GITHUB_OUTPUT"

      - name: clone prabhasa-nyaya at that exact commit (read-only deploy key, SSH)
        env:
          DEPLOY_KEY: ${{ secrets.PRABHASA_NYAYA_DEPLOY_KEY }}
        # runner.temp (not /tmp): a plain destination-path issue was rejected on the first real run (this
        # job had never actually cloned anything until cf4a325 landed), so a first fix moved the clone off
        # the shared, sticky-bit /tmp -- that alone did not fix it. The real bug (found on the SECOND real
        # run, dbdf47a): `umask 177` below is set to keep the deploy-key file 600, but a umask is
        # shell-wide and stays in effect for the rest of the script -- including the `git clone` a few
        # lines later. With umask 177, git's own `mkdir` for the destination directory (and for `.git`
        # inside it) gets mode 600: no execute bit, so nothing can be created inside it at all. That is
        # exactly the "Invalid path '<path>/.git': Permission denied" git reports -- a plain EACCES on
        # directory creation, not an auth or destination-path problem. Fix: restore the default umask
        # (022) immediately after the key file is written, before anything else creates a directory.
        run: |
          set -euo pipefail
          KEY_FILE="$(mktemp)"
          cleanup() { rm -f "$KEY_FILE"; }
          trap cleanup EXIT
          umask 177
          printf '%s\n' "$DEPLOY_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          umask 022
          export GIT_SSH_COMMAND="ssh -i $KEY_FILE -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --filter=blob:none git@github.com:AxisMeru/prabhasa-nyaya.git "$RUNNER_TEMP/prabhasa-nyaya"
          git -C "$RUNNER_TEMP/prabhasa-nyaya" checkout --detach "${{ steps.pin.outputs.commit }}"
          # The key file is also removed by the trap above on any exit path (success or failure); this
          # explicit rm is redundant on the happy path but costs nothing and removes any doubt.
          rm -f "$KEY_FILE"

      # Same install command prabhasa-nyaya's own CI uses (its .github/workflows/ci.yml), not a
      # separately-guessed one -- elan itself then reads $RUNNER_TEMP/prabhasa-nyaya/lean/lean-toolchain
      # and fetches the pinned Lean toolchain named there on first `lake build` below.
      - name: install elan (Lean toolchain manager)
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/v4.2.4/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: lake build
        working-directory: ${{ runner.temp }}/prabhasa-nyaya/lean
        run: lake build

      - name: verify the built binary's sha256 against pinned_score_sha256 -- fail loud on any mismatch
        run: uv run python scripts/verify_score_bin_sha.py "$RUNNER_TEMP/prabhasa-nyaya/lean/.lake/build/bin/score"

      - uses: actions/upload-artifact@v4
        with:
          name: prabhasa-nyaya-score-bin
          path: ${{ runner.temp }}/prabhasa-nyaya/lean/.lake/build/bin/score
          retention-days: 1

  engine:
    runs-on: ubuntu-latest
    needs: [build-lean-binary]
    # Runs regardless of build-lean-binary's outcome (success, failure, OR skipped -- a fork PR skips that
    # job entirely, by design): the pytest step below still runs either way, and
    # check_score_bin_gate_ran.py is the permanent backstop that makes the difference visible rather than
    # silent -- green with the real binary available, red (as designed, see that script's own docstring)
    # without it.
    if: "!cancelled()"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.13" }
      - run: uv sync --all-groups --frozen
      - run: uv run ruff check pravrudhi_kernel src tests scripts
      - run: uv run mypy src
      - name: download the real Lean binary (absent on a fork PR or a failed build -- pytest below still runs)
        if: needs.build-lean-binary.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: prabhasa-nyaya-score-bin
          path: /tmp/score-bin
      - name: mark the downloaded binary executable
        if: needs.build-lean-binary.result == 'success'
        run: chmod +x /tmp/score-bin/score
      - name: pytest (with the real Lean binary when build-lean-binary produced one)
        env:
          PRABHASA_NYAYA_SCORE_BIN: /tmp/score-bin/score
        run: uv run pytest tests -q
      - run: uv run python scripts/import_guard.py
      - run: uv run python scripts/check_no_private_data.py
      # Permanent backstop (Lead-2, 2026-09-26): fails if not one requires_score_bin-gated test actually
      # executed. Green whenever build-lean-binary supplied a real, pin-verified binary above; red on a fork
      # PR or if that job ever fails -- both cases where the registry/pin tests genuinely did not run here,
      # which is exactly what this exists to make impossible to miss.
      - run: uv run python scripts/check_score_bin_gate_ran.py

  # The local-engine e2e project starts a real engine and drives the real interface. Nothing ran it: pages.yml
  # runs only --project=deployed and this file had no Playwright at all, so when the front door was reworked and
  # its heading renamed, the test asserting the old name stayed red and unnoticed.
  #
  # Scoped to the page-rendering tests, which need no model. The chat-streaming test in the same file requires a
  # reachable completion endpoint, and a CI runner has none; including it would make this job fail for a reason
  # that says nothing about the change under test.
  live-interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.13" }
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - run: uv sync --all-groups --frozen
      - name: build the interface the engine serves
        working-directory: app/frontend
        # A sign-in page needs a Supabase project named at build time to render its form at all; these two are
        # public, inert values so the page has a form for the guards to check (nothing is called until submit).
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
        run: |
          npm ci
          npm run build
      - name: frontend lint stays clean
        working-directory: app/frontend
        run: npx eslint . --max-warnings=0
      - name: install playwright browsers
        working-directory: app/frontend
        run: npx playwright install --with-deps chromium firefox
      - name: every page renders on a real engine, in both engines
        working-directory: app/frontend
        run: npx playwright test --project=local-engine-chromium --project=local-engine-firefox --grep "renders its own live page"
      # Edition separation on live engines of BOTH editions (ADR-0049; the 2026-09-11 desktop review found the two
      # editions to be one interface with a stale filter). The webServer above is Studio; a second engine is
      # started here as the product edition from the same checkout, since edition is an environment variable.
      - name: the product edition hides and gates Studio's pages; Studio keeps them
        working-directory: app/frontend
        run: |
          PRAVRUDHI_EDITION=product ../../.venv/bin/python -m pravrudhi app --root ../.. --no-browser --port 8138 --host 127.0.0.1 > /tmp/product-engine.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8138/api/health > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8138/api/me
          LOCAL_ENGINE_URL=http://127.0.0.1:8138 npx playwright test --project=edition-chromium
          PRAVRUDHI_EDITION=studio ../../.venv/bin/python -m pravrudhi app --root ../.. --no-browser --port 8139 --host 127.0.0.1 > /tmp/studio-engine.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8139/api/health > /dev/null && break; sleep 1; done
          LOCAL_ENGINE_URL=http://127.0.0.1:8139 npx playwright test --project=edition-chromium

  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.13" }
      - run: uv sync --all-groups --frozen
      # 2026-09-14: v0.5.20 shipped with pyproject.toml bumped but uv.lock never regenerated in the same
      # commit, so every uv sync/uv run against main re-derived the newer version locally and dirtied
      # uv.lock for anyone syncing this repo - including the studio loop's rebase-before-beat, which parked
      # for hours on a wall that only `uv lock` could clear. `--frozen` above is what let this land in the
      # first place: it trusts the lockfile as-is and never checks it against pyproject.toml, so CI stayed
      # green through the drift. `--check` is the opposite: it fails loudly if the two disagree, without
      # writing anything, so this catches the exact mismatch before it merges rather than after every clone.
      - run: uv lock --check
      - run: uv run pytest tests/governance -q
      - name: no attribution trailers in history
        run: |
          if git log --format=%B | grep -qiE '^(Co-Authored-By|Claude-Session):'; then
            echo "attribution trailer found in history"; exit 1; fi
