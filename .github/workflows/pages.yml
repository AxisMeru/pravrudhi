name: pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */6 * * *"

permissions:
  pages: write
  id-token: write
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 40 }  # the progress page lists recent commits; a shallow clone showed one

      - uses: actions/setup-node@v4
        with: { node-version: "24" }

      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.13" }

      - name: build frontend static export
        working-directory: app/frontend
        env:
          NEXT_PUBLIC_DEMO: "1"
          NEXT_PUBLIC_BASE_PATH: /pravrudhi/app
        run: |
          npm ci
          npm run build

      - name: stage frontend export
        run: |
          mkdir -p site/app
          cp -r app/frontend/out/. site/app/

      - name: build paper
        id: paper
        continue-on-error: true
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: paper
          args: -pdf -interaction=nonstopmode -halt-on-error

      - name: stage paper
        if: steps.paper.outcome == 'success'
        run: |
          mkdir -p site/paper
          cp paper/main.pdf site/paper/main.pdf

      - name: render progress page
        run: |
          uv sync --all-groups --frozen
          uv run python scripts/progress_page.py site/

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  deployed-e2e:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: "24" }

      - name: install frontend dependencies
        working-directory: app/frontend
        run: npm ci

      # All three engines behind the major desktop browsers: Chromium is Chrome and Edge, Gecko is Firefox,
      # WebKit is Safari. A Chromium-only run cannot see the differences Safari actually has.
      - name: install playwright browsers
        working-directory: app/frontend
        run: npx playwright install --with-deps chromium firefox webkit

      - name: run deployed e2e suite against the live site in every major browser
        working-directory: app/frontend
        env:
          DEPLOYED_URL: ${{ needs.deploy.outputs.page_url }}app/
        run: npx playwright test --project=deployed-chromium --project=deployed-firefox --project=deployed-webkit
