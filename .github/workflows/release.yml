name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  desktop:
    # Both editions on all three desktop operating systems. Studio is the operator's edition and the product is
    # what a user installs; they carry different appIds and product names so one machine can hold both. Each
    # runner builds its own platform: a macOS dmg cannot be produced off macOS, and a Windows installer needs
    # wine to be cross-built, which is a dependency this would rather not have in a release path.
    strategy:
      fail-fast: false
      matrix:
        edition: [product, studio]
        platform: [linux, mac, win]
        # Each entry names an existing `platform`, so it adds the runner and artifact glob to that platform's
        # combinations rather than to every one of them. Six jobs: two editions on three operating systems.
        include:
          - { platform: linux, os: ubuntu-latest }
          - { platform: mac, os: macos-latest }
          - { platform: win, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: "24" }

      - name: build ${{ matrix.edition }} for ${{ matrix.platform }}
        working-directory: app/desktop
        shell: bash
        run: |
          npm install --no-audit --no-fund
          npx electron-builder --${{ matrix.platform }} --config electron-builder.${{ matrix.edition }}.json

      - name: the build must not have rewritten its own package.json
        working-directory: app/desktop
        shell: bash
        run: node -e "const p=require('./package.json'); if(!p.scripts||!p.main) { throw new Error('the build clobbered package.json'); }"

      # Every shape a desktop build can produce, each fully qualified by the edition's own output directory.
      # A job uploads whatever its platform actually built and the other patterns match nothing; `error` still
      # catches a job that produced no artifact at all. Carrying the glob in the matrix instead looked tidier
      # and was wrong: a second pattern would have arrived without this prefix and quietly matched nothing.
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.edition }}-${{ matrix.platform }}
          path: |
            app/desktop/dist/${{ matrix.edition }}/*.AppImage
            app/desktop/dist/${{ matrix.edition }}/*.dmg
            app/desktop/dist/${{ matrix.edition }}/*.exe
            app/desktop/dist/${{ matrix.edition }}/*.zip
          if-no-files-found: error

  release:
    needs: [desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: "24" }

      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.13" }

      - name: build frontend
        working-directory: app/frontend
        run: |
          npm ci
          npm run build

      - name: build wheels (engine and kernel; the engine wheel alone does not resolve)
        run: |
          uv build --wheel
          uv build --wheel --package pravrudhi-kernel

      # Every desktop artifact the matrix produced, flattened into one directory for the checksum file.
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: dist

      - name: checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.AppImage
            dist/*.dmg
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
