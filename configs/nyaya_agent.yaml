  bsa63: (1) Notwithstanding anything contained in this Adhiniyam, any information contained in an electronic record which is printed on paper, stored, recorded or copied in optical or magnetic media or semiconductor memory which is produced by a computer or any communication device or otherwise stored, recorded or copied in any electronic form (hereinafter referred to as the computer output) shall be deemed to be also a document, if the conditions mentioned in this section are satisfied in relation to the information and computer in question and shall be admissible in any proceedings, without further proof or production of the original, as evidence or any contents of the original or of any fact stated therein of which direct evidence would be admissible. (2) The conditions referred to in sub-section (1) in respect of a computer output shall be the following, namely:--- (a) the computer output containing the information was produced by the computer or communication device during the period over which the computer or Communication device was used regularly to create, store or process information for the purposes of any activity regularly carried on over that period by the person having lawful control over the use of the computer or communication device; (b) during the said period, information of the kind contained in the electronic record or of the kind from which the information so contained is derived was regularly fed into the computer or Communication device in the ordinary course of the said activities; (c) throughout the material part of the said period, the computer or communication device was operating properly or, if not, then in respect of any period in which it was not operating properly or was out of operation during that part of the period, was not such as to affect the electronic record or the accuracy of its contents; and (d) the information contained in the electronic record reproduces or is derived from such information fed into the computer or Communication device in the ordinary course of the said activities. (3) Where over any period, the function of creating, storing or processing information for the purposes of any activity regularly carried on over that period as mentioned in clause (a) of sub-section (2) was regularly performed by means of one or more computers or communication device, whether-- (a) in standalone mode; or (b) on a computer system; or (c) on a computer network; or (d) on a computer resource enabling information creation or providing information processing and storage; or (e) through an intermediary, all the computers or communication devices used for that purpose during that period shall be treated for the purposes of this section as constituting a single computer or communication device; and references in this section to a computer or communication device shall be construed accordingly. (4) In any proceeding where it is desired to give a statement in evidence by virtue of this section, a certificate doing any of the following things shall be submitted along with the electronic record at each instance where it is being submitted for admission, namely:-- (a) identifying the electronic record containing the statement and describing the manner in which it was produced; (b) giving such particulars of any device involved in the production of that electronic record as may be appropriate for the purpose of showing that the electronic record was produced by a computer or a communication device referred to in clauses (a) to (e) of sub-section (3); (c) dealing with any of the matters to which the conditions mentioned in sub-section (2) relate, and purporting to be signed by a person in charge of the computer or communication device or the management of the relevant activities (whichever is appropriate) and an expert shall be evidence of any matter stated in the certificate; and for the purposes of this sub-section it shall be sufficient for a matter to be stated to the best of the knowledge and belief of the person stating it in the certificate specified in the Schedule. (5) For the purposes of this section,--- (a) information shall be taken to be supplied to a computer or communication device if it is supplied thereto in any appropriate form and whether it is so supplied directly or (with or without human intervention) by means of any appropriate equipment; (b) a computer output shall be taken to have been produced by a computer or communication device whether it was produced by it directly or (with or without human intervention) by means of any appropriate equipment or by other electronic means as referred to in clauses (a) to (e) of sub-section (3).
  ibc7_application: '(1) A financial creditor either by itself or jointly with other financial creditors, or any other person on behalf of the financial creditor, as may be notified by the Central Government, may file an application for initiating corporate insolvency resolution process against a corporate debtor before the Adjudicating Authority when a default has occurred. Provided that for the financial creditors, referred to in clauses (a) and (b) of sub-section (6A) of section 21, an application for initiating corporate insolvency resolution process against the corporate debtor shall be filed jointly by not less than one hundred of such creditors in the same class or not less than ten per cent. of the total number of such creditors in the same class, whichever is less: Provided further that for financial creditors who are allottees under a real estate project, an application for initiating corporate insolvency resolution process against the corporate debtor shall be filed jointly by not less than one hundred of such allottees under the same real estate project or not less than ten per cent. of the total number of such allottees under the same real estate project, whichever is less: Provided also that where an application for initiating the corporate insolvency resolution process against a corporate debtor has been filed by a financial creditor referred to in the first and second provisos and has not been admitted by the Adjudicating Authority before the commencement of the Insolvency and Bankruptcy Code (Amendment) Act, 2020, such application shall be modified to comply with the requirements of the first or second proviso within thirty days of the commencement of the said Act, failing which the application shall be deemed to be withdrawn before its admission. Explanation.--For the purposes of this sub-section, a default includes a default in respect of a financial debt owed not only to the applicant financial creditor but to any other financial creditor of the corporate debtor. (2) The financial creditor shall make an application under sub-section (1) in such form and manner and accompanied with such fee as may be prescribed. (3) The financial creditor shall, along with the application furnish-- (a) record of the default recorded with the information utility or such other record or evidence of default as may be specified; (b) the name of the resolution professional proposed to act as an interim resolution professional; and (c) any other information as may be specified by the Board. (4) The Adjudicating Authority shall, within fourteen days of the receipt of the application under sub-section (2), ascertain the existence of a default from the records of an information utility or on the basis of other evidence furnished by the financial creditor under sub-section (3). Provided that if the Adjudicating Authority has not ascertained the existence of default and passed an order under sub-section (5) within such time, it shall record its reasons in writing for the same. (5) Where the Adjudicating Authority is satisfied that-- (a) a default has occurred and the application under sub-section (2) is complete, and there is no disciplinary proceedings pending against the proposed resolution professional, it may, by order, admit such application; or (b) default has not occurred or the application under sub-section (2) is incomplete or any disciplinary proceeding is pending against the proposed resolution professional, it may, by order, reject such application: Provided that the Adjudicating Authority shall, before rejecting the application under clause (b) of sub-section (5), give a notice to the applicant to rectify the defect in his application within seven days of receipt of such notice from the Adjudicating Authority. (6) The corporate insolvency resolution process shall commence from the date of admission of the application under sub-section (5). (7) The Adjudicating Authority shall communicate-- (a) the order under clause (a) of sub-section (5) to the financial creditor and the corporate debtor; (b) the order under clause (b) of sub-section (5) to the financial creditor, within seven days of admission or rejection of such application, as the case may be.'
