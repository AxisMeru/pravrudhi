# The Nyaya agentic loop (pravrudhi.application.nyaya_agent): facts in, per-contract PROOF / DENIAL /
# ABSTAIN / REFER_TO_LAWYER out, every step on a JSONL audit trail. Constants live here, never in code.

# The Lean `score` binary the loop checks every assembled wire with, and the FULL sha256 it must have.
# A binary whose hash differs is refused before any call (never "close enough"). Relative to the repo root;
# the PRABHASA_NYAYA_SCORE_BIN environment variable wins, same as configs/nyaya_gold.yaml.
# The pinned binary is the 26-contract build of prabhasa-nyaya 91bf49d (BNS 80, BNS 108, BNSS 187, NI Act 138),
# rebuilt byte-identically by reviewer 1. Must equal deploy/docker/Dockerfile's NYAYA_SCORE_SHA256
# (tests/test_config_files.py).
score_bin: ../prabhasa-nyaya/lean/.lake/build/bin/score
pinned_score_sha256: 29f6eaed3ef5c548d6c8a1cdf884c9a73895937132779ea4d4cffb8e66cb80ae

# The house element judge: an OpenAI-compatible vLLM server serving the fine-tuned element judge.
# `model: null` means "the first id the server's own /v1/models lists".
house_judge:
  base_url: http://127.0.0.1:8110/v1
  model: null
  # 60s is right for the always-warm 5090. A serverless deployment (no warm workers) needs far more: the
  # judge's own cold start alone runs ~200s. NYAYA_HOUSE_JUDGE_TIMEOUT_S overrides this per-deployment
  # (2026-09-24: a fully-cold demo visit hit ABSTAIN/judge_error every time before this was raised).
  timeout_s: 60
  # First-token top-k logprobs read for P(" established") vs P(" not"); the span comes from the same
  # greedy completion, which needs room for `established F1:0:123`.
  top_logprobs: 20
  max_tokens: 30
  # The training prompt truncated the statute to its first 600 characters; the judge sees the same.
  statute_chars: 600
  # How many (contract, element/denial) judge requests one `NyayaAgent.run` call judges at once, bounded by a
  # ThreadPoolExecutor (docs/decisions 2026-09-24). 1 is today's serial behaviour, byte-identical results and
  # audit ordering -- unchanged unless this is raised. NYAYA_JUDGE_MAX_CONCURRENCY overrides.
  max_concurrency: 1

# Decision threshold on p_established: established iff p >= tau. 0.74 is the dual-signed v0 value
# (element-judge 4B v0, val-split false-prove sweep, 2026-09-22).
tau: 0.74

# REFER_TO_LAWYER when any judged element's p_established falls in [low, high).
# UNVALIDATED DEFAULT, CALIBRATION PENDING M3: not pre-registered, not fitted on any split. [0.5, tau) is
# the region where the model's own argmax says "established" but tau says not -- where the threshold
# choice, not the evidence, decides.
refer_band: [0.5, 0.74]

# Re-ask an element at most this many times (first attempt excluded) when its judge output is malformed or
# its quote is not a verbatim substring of the named fact. A retry sends the SAME request (same training
# statute text below) and is used ONLY for its quote: attempt 1's status and p_established stand.
max_retries: 2

# Where each run's JSONL audit trail is written, relative to the repo root.
audit_dir: research/nyaya/agent_runs

# Optional config C: a SECOND judge, AND-gated with house_judge above (nyaya_judges.AndGateJudge). Absent (the
# default, as below) is exactly today's single-house-judge behaviour -- the second is called ONLY when
# house_judge already says established, and an element proves iff BOTH clear their own tau. Same keys as
# house_judge, plus its OWN tau (config C: 0.97 for the 32B QLoRA judge, dual-signed 2026-09-23 val sweep).
# NYAYA_SECOND_JUDGE_BASE_URL / _MODEL / _API_KEY / _TAU / _TIMEOUT_S override; NYAYA_SECOND_JUDGE_API_KEY is
# read directly (never merged into this block), same pattern as NYAYA_HOUSE_JUDGE_API_KEY.
# second_judge:
#   base_url: http://127.0.0.1:8111/v1
#   model: null
#   timeout_s: 60
#   top_logprobs: 20
#   max_tokens: 30
#   statute_chars: 600
#   tau: 0.97

# The statute text the house judge was trained with (public statute text: IPC 1860 / BNS 2023), keyed by
# registry contract id. The ONLY statute text the judge ever sees, on every attempt, so it stays in its
# training distribution. The binary's official --describe-source text is for the Lean side and the audit
# record only; each run records `statute_text_mismatch` per contract (9 of 14 differ from the official
# text, 2026-09-24) as the target list for M2 retraining on official texts. A contract with no entry here
# is not judged (ABSTAIN, no_training_statute_text).
#
# 2026-09-25 (Lead-2, production relay test): the Wave-1 registry expansion (Track A, 2026-09-23 --
# nyaya_lean_registry.py's KNOWN_CONTRACT_IDS, 14 -> 26 contracts: BNS 316/318/217/80/108, BNSS 187, NI
# Act 138) added these to the Lean scoring side but never to this table, so every one of them ABSTAINed
# with no_training_statute_text on both the RunPod and 5090 engines -- the same yaml file, not an
# image/build-context bug. bns69/47/85/46_* (part of the ORIGINAL 14) were already correct; this is not an
# IPC-vs-BNS keying bug, it is specifically the 12 Wave-1 ids that were never wired.
#
# IMPORTANT CAVEAT, not fixed by adding these entries alone: the dual-signed element-judge eval (config C,
# 2026-09-23, checker_pass 109/377, false-prove 0/225) covers EXACTLY the original 14 contract ids --
# confirmed by reading every item_id in the frozen eval rows
# (/home/ss/fusion-project/tmp_scratch/lead2/final_c/final_c_rows.jsonl). None of the 12 Wave-1 ids below
# have ever been measured for false-prove rate. Adding statute text here turns ABSTAIN into real PROOF/
# DENIAL judging for them with an UNVALIDATED judge -- correct per the letter of "add the missing entry",
# but a real accuracy-claim gap the operator/Lead-2 should decide on, not something this comment should
# paper over.
#
# BNS 316/318/217/80/108 and BNSS 187 text below is quoted verbatim (trimmed to the first operative
# sentence, same convention as the other entries) from `research/nyaya/corpus/bns.json`
# (sha256 ce4d9855f0804fa40a9481be1681d23971fb29125d18d9d2a43f2831203da63c) and `bnss.json`
# (source page sha256 572c79880b9f8effc8fa6e39b864101835a0fb5d85b194b90a99d170121a0562) -- both already
# in the fetched, operator-authorized corpus (india_code_fetch.py's fixed five-Act list).
#
# 2026-09-25 (Lead-2, browser fetch authorized separately from india_code_fetch.py's fixed five-Act list):
# NI Act 138's text is now sourced too, from `research/nyaya/corpus/ni.json`, see its own comment above.
judge_statute_text:
  ipc405_misappropriation: Whoever, being in any manner entrusted with property, or with any dominion over property, dishonestly misappropriates or converts to his own use that property, or dishonestly uses or disposes of that property in violation of any direction of law prescribing the mode in which such trust is to be discharged, or of any legal contract, express or implied, which he has made touching the discharge of such trust, or wilfully suffers any other person so to do, commits "criminal breach of trust".
  ipc405_use_or_disposal: Whoever, being in any manner entrusted with property, or with any dominion over property, dishonestly misappropriates or converts to his own use that property, or dishonestly uses or disposes of that property in violation of any direction of law prescribing the mode in which such trust is to be discharged, or of any legal contract, express or implied, which he has made touching the discharge of such trust, or wilfully suffers any other person so to do, commits "criminal breach of trust".
  ipc405_wilfully_suffers: Whoever, being in any manner entrusted with property, or with any dominion over property, dishonestly misappropriates or converts to his own use that property, or dishonestly uses or disposes of that property in violation of any direction of law prescribing the mode in which such trust is to be discharged, or of any legal contract, express or implied, which he has made touching the discharge of such trust, or wilfully suffers any other person so to do, commits "criminal breach of trust".
  ipc415_property: Whoever, by deceiving any person, fraudulently or dishonestly induces the person so deceived to deliver any property to any person, or to consent that any person shall retain any property, or intentionally induces the person so deceived to do or omit to do anything which he would not do or omit if he were not so deceived, and which act or omission causes or is likely to cause damage or harm to that person in body, mind, reputation or property, is said to "cheat".
  ipc415_damaging_act: Whoever, by deceiving any person, fraudulently or dishonestly induces the person so deceived to deliver any property to any person, or to consent that any person shall retain any property, or intentionally induces the person so deceived to do or omit to do anything which he would not do or omit if he were not so deceived, and which act or omission causes or is likely to cause damage or harm to that person in body, mind, reputation or property, is said to "cheat".
  ipc416: A person is said to "cheat by personation" if he cheats by pretending to be some other person, or by knowingly substituting one person for or another, or representing that he or any other person is a person other than he or such other person really is.
  ipc182_misdirected_act: Whoever gives to any public servant any information which he knows or believes to be false, intending thereby to cause, or knowing it to be likely that he will thereby cause, such public servant to do or omit anything which such public servant ought not to do or omit if the true state of facts respecting which such information is given were known by him, shall be punished.
  ipc182_abuse_of_power: Whoever gives to any public servant any information which he knows or believes to be false, intending thereby to cause, or knowing it to be likely that he will thereby cause, such public servant to use the lawful power of such public servant to the injury or annoyance of any person, shall be punished.
  bns69: Whoever, by deceitful means or by making promise to marry to a woman without any intention of fulfilling the same, has sexual intercourse with her, such sexual intercourse not amounting to the offence of rape, shall be punished.
  bns47: A person abets an offence within the meaning of this Sanhita who, in India, abets the commission of any act without and beyond India which would constitute an offence if committed in India.
  bns85: Whoever, being the husband or the relative of the husband of a woman, subjects such woman to cruelty shall be punished.
  bns46_instigation: A person abets an offence, who abets either the commission of an offence, or the commission of an act which would be an offence, if committed by a person capable by law of committing an offence with the same intention or knowledge as that of the abettor.
  bns46_conspiracy: A person abets an offence, who abets either the commission of an offence, or the commission of an act which would be an offence, if committed by a person capable by law of committing an offence with the same intention or knowledge as that of the abettor.
  bns46_intentional_aid: A person abets an offence, who abets either the commission of an offence, or the commission of an act which would be an offence, if committed by a person capable by law of committing an offence with the same intention or knowledge as that of the abettor.
  bns316_misappropriation: Whoever, being in any manner entrusted with property, or with any dominion over property, dishonestly misappropriates or converts to his own use that property, or dishonestly uses or disposes of that property in violation of any direction of law prescribing the mode in which such trust is to be discharged, or of any legal contract, express or implied, which he has made touching the discharge of such trust, or wilfully suffers any other person so to do, commits "criminal breach of trust".
  bns316_use_or_disposal: Whoever, being in any manner entrusted with property, or with any dominion over property, dishonestly misappropriates or converts to his own use that property, or dishonestly uses or disposes of that property in violation of any direction of law prescribing the mode in which such trust is to be discharged, or of any legal contract, express or implied, which he has made touching the discharge of such trust, or wilfully suffers any other person so to do, commits "criminal breach of trust".
  bns316_wilfully_suffers: Whoever, being in any manner entrusted with property, or with any dominion over property, dishonestly misappropriates or converts to his own use that property, or dishonestly uses or disposes of that property in violation of any direction of law prescribing the mode in which such trust is to be discharged, or of any legal contract, express or implied, which he has made touching the discharge of such trust, or wilfully suffers any other person so to do, commits "criminal breach of trust".
  bns318_property: Whoever, by deceiving any person, fraudulently or dishonestly induces the person so deceived to deliver any property to any person, or to consent that any person shall retain any property, or intentionally induces the person so deceived to do or omit to do anything which he would not do or omit if he were not so deceived, and which act or omission causes or is likely to cause damage or harm to that person in body, mind, reputation or property, is said to "cheat".
  bns318_damaging_act: Whoever, by deceiving any person, fraudulently or dishonestly induces the person so deceived to deliver any property to any person, or to consent that any person shall retain any property, or intentionally induces the person so deceived to do or omit to do anything which he would not do or omit if he were not so deceived, and which act or omission causes or is likely to cause damage or harm to that person in body, mind, reputation or property, is said to "cheat".
  bns217_misdirected_act: Whoever gives to any public servant any information which he knows or believes to be false, intending thereby to cause, or knowing it to be likely that he will thereby cause, such public servant to do or omit anything which such public servant ought not to do or omit if the true state of facts respecting which such information is given were known by him, shall be punished.
  bns217_abuse_of_power: Whoever gives to any public servant any information which he knows or believes to be false, intending thereby to cause, or knowing it to be likely that he will thereby cause, such public servant to use the lawful power of such public servant to the injury or annoyance of any person, shall be punished.
  bns80: Where the death of a woman is caused by any burns or bodily injury or occurs otherwise than under normal circumstances within seven years of her marriage and it is shown that soon before her death she was subjected to cruelty or harassment by her husband or any relative of her husband for, or in connection with, any demand for dowry, such death shall be called "dowry death", and such husband or relative shall be deemed to have caused her death.
  bns108: If any person commits suicide, whoever abets the commission of such suicide, shall be punished with imprisonment of either description for a term which may extend to ten years, and shall also be liable to fine.
  bnss187_extended_serious: Whenever any person is arrested and detained in custody, and it appears that the investigation cannot be completed within the period of twenty-four hours fixed by section 58, and there are grounds for believing that the accusation or information is well-founded, the officer in charge of the police station or the police officer making the investigation, if he is not below the rank of sub-inspector, shall forthwith transmit to the nearest Magistrate a copy of the entries in the diary hereinafter specified relating to the case, and shall at the same time forward the accused to such Magistrate.
  bnss187_extended_other: Whenever any person is arrested and detained in custody, and it appears that the investigation cannot be completed within the period of twenty-four hours fixed by section 58, and there are grounds for believing that the accusation or information is well-founded, the officer in charge of the police station or the police officer making the investigation, if he is not below the rank of sub-inspector, shall forthwith transmit to the nearest Magistrate a copy of the entries in the diary hereinafter specified relating to the case, and shall at the same time forward the accused to such Magistrate.
  # NI Act 138, sourced from research/nyaya/corpus/ni.json (indiacode.gov.in, fetched 2026-09-25) with its
  # amendment-marker brackets (1[, 2[, 3[) mechanically stripped per that file's own text_edits record --
  # the wrapped substituted text is kept verbatim, nothing paraphrased. Two of the portal's own rendering
  # quirks are kept deliberately verbatim, per instruction, not silently corrected: "debt of other liability"
  # (missing "r" in "or") and "a notice; in writing" (semicolon where a comma reads more naturally). One
  # single-character difference from the pinned Lean binary's own --describe-source ni138 was found and IS
  # corrected here (recorded in ni.json's text_edits, not silently): the binary's copy reads
  # "Explanation .--" (space before the period); the portal's own rendering read "Explanation.--" with no
  # space. Paragraph breaks are collapsed to single spaces (not kept as real newlines, unlike ni.json's own
  # `text` field) to match the binary's own --describe-source rendering exactly, same as every other entry
  # in this table -- confirmed byte-for-byte identical against the real pinned binary (sha 29f6eaed...),
  # not just Lead-2's normalized comparison, so this entry sets statute_text_mismatch=false.
  ni138: "Where any cheque drawn by a person on an account maintained by him with a banker for payment of any amount of money to another person from out of that account for the discharge, in whole or in part, of any debt or other liability, is returned by the bank unpaid, either because of the amount of money standing to the credit of that account is insufficient to honour the cheque or that it exceeds the amount arranged to be paid from that account by an agreement made with that bank, such person shall be deemed to have committed an offence and shall, without prejudice to any other provision of this Act, be punished with imprisonment for a term which may be extended to two years, or with fine which may extend to twice the amount of the cheque, or with both: Provided that nothing contained in this section shall apply unless-- (a) the cheque has been presented to the bank within a period of six months from the date on which it is drawn or within the period of its validity, whichever is earlier; (b) the payee or the holder in due course of the cheque, as the case may be, makes a demand for the payment of the said amount of money by giving a notice; in writing, to the drawer of the cheque, within thirty days of the receipt of information by him from the bank regarding the return of the cheque as unpaid; and (c) the drawer of such cheque fails to make the payment of the said amount of money to the payee or, as the case may be, to the holder in due course of the cheque, within fifteen days of the receipt of the said notice. Explanation .-- For the purposes of this section, debt of other liability means a legally enforceable debt or other liability."

# Safety gate (Lead-2, 2026-09-25), decided the same day the ABSTAIN gap above was closed: the element judge
# has never been trained or measured on any of the 12 contracts below (the dual-signed eval, config C,
# checker_pass 109/377, false-prove 0/225, covers only the original 14). Every element for a contract listed
# here still judges, quotes and Lean-checks normally -- the reasoning stays fully visible in the response and
# the audit trail -- but NyayaAgent._run_contract intercepts a final PROOF or DENIAL for one of these and
# returns REFER_TO_LAWYER (reason contract_not_validated) instead. An outcome that is already ABSTAIN or
# REFER_TO_LAWYER for another reason is never touched by this gate.
#
# THIS IS NOT A TODO. A contract leaves this list only by Lead-2's explicit decision, after a signed eval of
# the M2-trained judge that actually covers it -- never by whoever next edits this file, and never just
# because the ABSTAIN gap looked closed once statute text existed. ni138 was added to this list in the SAME
# commit that gave it a judge_statute_text entry above, precisely so its ABSTAIN never has a window where it
# turns into unvalidated PROOF/DENIAL judging before this gate catches it.
unvalidated_contracts:
  - bns316_misappropriation
  - bns316_use_or_disposal
  - bns316_wilfully_suffers
  - bns318_property
  - bns318_damaging_act
  - bns217_misdirected_act
  - bns217_abuse_of_power
  - bns80
  - bns108
  - bnss187_extended_serious
  - bnss187_extended_other
