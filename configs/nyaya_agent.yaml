# The Nyaya agentic loop (pravrudhi.application.nyaya_agent): facts in, per-contract PROOF / DENIAL /
# ABSTAIN / REFER_TO_LAWYER out, every step on a JSONL audit trail. Constants live here, never in code.

# The Lean `score` binary the loop checks every assembled wire with, and the FULL sha256 it must have.
# A binary whose hash differs is refused before any call (never "close enough"). Relative to the repo root;
# the PRABHASA_NYAYA_SCORE_BIN environment variable wins, same as configs/nyaya_gold.yaml.
# Must equal deploy/docker/Dockerfile's NYAYA_SCORE_SHA256 (tests/test_config_files.py).
#
# 2026-09-26 (Studio-on-Seat0, Lead-2's item-3 authorization, after item-1's regression suite ran clean):
# re-pinned from the 26-contract build of prabhasa-nyaya 91bf49d to the 37-contract build of
# assistant/trackA/wave23-integration @636c540 (signed pin candidate, "37 contracts, signed pin candidate"
# per docs/decisions/... CRITICAL-PATH.md's own Lean-waves-2-3 line) -- adds bnss528, bsa63, ibc7_*, ibc9_*,
# contract73/74, contract56_* (see nyaya_lean_registry.py's KNOWN_CONTRACT_IDS docstring for the full list
# and each one's own sourcing record). Item-1 regression: all 26 pre-existing contracts' --describe-source,
# --describe-contract, and check_registry PROOF/DENIAL/missing-element paths are byte-identical between the
# old (29f6eaed...) and new (700de3aa...) binaries, except ni138's source text (see its own entry below --
# a deliberate, already-documented content fix on the candidate branch, not a regression). This is the
# RELEASE BRANCH's own pin -- it does not change what's live in production; that only happens when this
# release actually deploys (Lead-2's item 5: tag, image smoke, Track-C's switch-on smoke, then cutover).
score_bin: ../prabhasa-nyaya/lean/.lake/build/bin/score
pinned_score_sha256: 700de3aadf50b482f4cf23499a03fd518cf72734bf8f51b950b5983555dea229
# PRABHASA_NYAYA_PINNED_COMMIT: 636c540e3f682fad4e930f60e7c71cf7bbfe6630 (branch
# assistant/trackA/wave23-integration -- the same commit named in prose above, spelled out here in full and
# in a fixed, machine-parseable shape). CI's build-lean-binary job (scripts/extract_pinned_score_bin_commit.py)
# checks out and builds EXACTLY this commit, then verifies the result's sha256 against pinned_score_sha256
# above (scripts/verify_score_bin_sha.py) -- update this line in the SAME commit as any re-pin of that sha256,
