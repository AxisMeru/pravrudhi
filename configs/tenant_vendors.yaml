# Which panel vendors an API caller (a request served inside `credentials.serving_api`) may use.
# Default-closed: a vendor not listed here is refused with zero calls. A missing or unreadable file means nothing
# is allowed. The cli vendors (claude-cli, codex-cli) run on the operator's own seat and are refused for every
# API caller in code (`application/tenant_vendors.py`); listing one here is a load error, not an opt-in.
# The CLI and research entrypoints (outside serving_api) are not affected by this file.

# Bring-your-own-key vendors only: each resolves its key from the caller's own store.
default:
  - openai-api
  - anthropic-api
  - google-api
  - qwen-dashscope   # BYOK: key under provider alibaba-plan in the caller's own store

# Per-org additions or replacements, keyed by the org id (partner API key's org). `allow` replaces the default
# for that org; `extend` adds to it. Example (commented out):
# orgs:
#   acme:
#     extend: [nyaya-p2b-local]
orgs: {}
