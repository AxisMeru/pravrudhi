# Which Claude seat the command line spends, and what happens when it stops being spendable.
#
# Operator decision (11 Sep 2026), paraphrased: CLI load goes to the premium seat that is not the team login; the team login is the
# desktop-app account and is never used for CLI work while that seat can serve.
#
# `account.py` already pinned CLAUDE_CONFIG_DIR so an invocation could not pick up an account by accident.
# That settled WHICH account, on the assumption there was one. There are two, they are not interchangeable,
# and the instruction gives them an order: spend the seat that comes and goes while it is there, and keep the
# one that is always there in reserve. A seat is therefore no longer a constant in a module; it is a list with
# a precedence, which is what this file is.
#
# ORDER IN THIS LIST IS THE PRECEDENCE. First entry is tried first. There is no `priority:` integer on
# purpose -- two entries can be given the same integer and then the order is whatever the YAML loader did,
# which is exactly the kind of "depending on" the account module was written to eliminate.
#
# A seat is skipped ONLY when it cannot serve: no credential in its directory, or it is inside a usage-limit
# cooldown. An ordinary failure does NOT advance to the next seat -- a prompt the model botched will be
# botched by the reserve seat too, and spending the always-available account on it is the opposite of
# balancing load. That distinction is `availability.classify`'s, and it is made there rather than here.
# The committed addresses are PLACEHOLDERS: a seat is an account the operator holds, and this tree is public. Real addresses live in
# the operator's local, uncommitted ~/.config/pravrudhi/seats.local.yaml (see `agents/seat_identity.py`); a placeholder with no local
# override is treated as unknown, never compared against.
version: 1
updated: 2026-10-06

seats:
  # The seat to spend. A second premium seat on the same Axis Meru team plan, held so that CLI load does not
  # all land on one account. It is the one the operator describes as dropping on and off premium, so it is
  # also the one the failover below exists for.
  - id: primary
    email: seat-a@example.invalid   # placeholder; the real address is in ~/.config/pravrudhi/seats.local.yaml (seats: {primary: ...})
    config_dir: ~/.claude

  # There is deliberately NO second entry. The team login's directory (`claude-admin`) is never a CLI seat: `account.seats` drops any
  # entry that resolves to it and `scripted_claude_home` refuses it, so no code path can spend it by name or by position. A fallback
  # seat, if one is ever wanted, must be a different account, added here explicitly, with its own directory.
