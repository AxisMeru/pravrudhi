# Which Claude seat the command line spends, and what happens when it stops being spendable.
#
# v2 (Lead-2, 2026-09-27): TEAM-RULES.md's own Claude usage cost rules (2026-09-26) settled which seat every
# scripted or agentic dispatch spends by default -- seat 0 (sharath.ai.colab@gmail.com), never seat 2
# (sathish, the operator's personal-domain team seat) as a default, and seat 1 (admin@axismeru.com) never at
# all for automated/agentic dispatch (it is the lead seats' own login, out of this registry entirely now).
#
# Seat 2 stays available as GENUINE OVERFLOW ONLY: this project may still spend it, but only while seat 0 is
# running hot AND seat 2 itself has real headroom left -- see `fallback`'s own `activation` block and
# `account.SeatActivation`'s docstring. Absent live usage data, the fallback is NEVER offered (fail closed --
# `account._activation_met`), so a watchdog outage means "seat 0 or nothing", never "silently spend seat 2".
#
# ORDER IN THIS LIST IS THE PRECEDENCE. First entry is tried first. There is no `priority:` integer on
# purpose -- two entries can be given the same integer and then the order is whatever the YAML loader did,
# which is exactly the kind of "depending on" the account module was written to eliminate.
#
# A seat is skipped for four reasons (`account.select_seat`): no credential in its directory; it is inside a
# usage-limit cooldown; its cached profile names a different account than its own declared `email` below
# (issue #82/#83's verification, reused here); or (fallback only) its `activation` condition does not
# currently hold. An ordinary failure does NOT advance to the next seat -- a prompt the model botched will be
# botched by the reserve seat too, and spending the always-available account on it is the opposite of
# balancing load. That distinction is `availability.classify`'s, and it is made there rather than here.
version: 2
updated: 2026-09-27

seats:
  # The seat every scripted and agentic dispatch spends by default (TEAM-RULES.md, 2026-09-26). Always
  # eligible once provisioned and not cooling -- no `activation` block, same as every seat before this
  # feature.
  - id: primary
    email: sharath.ai.colab@gmail.com
    config_dir: ~/.config/pravrudhi/claude-colab

  # Genuine overflow, not a default: a second premium seat on the same Axis Meru team plan, held so seat 0's
  # own 5-hour window running hot does not stall dispatch entirely. Reachable ONLY while seat 0 is at or above
  # 90% on its rolling 5-hour usage AND this seat's own weekly usage is still under 80% -- spending the
  # reserve into its own limit would just move the problem, not solve it. NEVER offered as a plain default,
  # and never chosen ahead of seat 0 while seat 0 can still serve.
  - id: fallback
    email: sharath.sathish@gmail.com
    config_dir: ~/.claude
    activation:
      depends_on_seat: primary
      other_seat_5h_pct_at_least: 90
      self_weekly_pct_below: 80

  # claude-admin (admin@axismeru.com) is DELIBERATELY not in this registry (Lead-2, 2026-09-27): it is the
  # lead seats' own login, never spent by automated or agentic dispatch. It was the reserve here under the
  # 2026-09-11 two-seat design, superseded by seat 0's introduction.
