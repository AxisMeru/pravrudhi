# The assistant tier (#122, engine half): whether the Anthropic-backed assistant (the frontier reader and any CMA/A0 call)
# can be offered right now. /api/health reports it as "assistant_tier": {"state", "reason"}. Nothing here has a default in
# code: a missing key, an unreadable file or a malformed value is "unavailable", never an assumed available.
enabled: true
# Live-read override: true forces the tier unavailable (reason "disabled") without touching keys or budget.
force_unavailable: false
# The tier needs at least one of these environment variables to be set and non-empty.
key_env_names:
  - ANTHROPIC_API_KEY
# Below this remaining balance (USD) the tier is unavailable (reason "budget_floor").
budget_floor_usd: 20
# Optional JSON file {"remaining_usd": <number>}. Configured but missing, unreadable or malformed = unavailable
# (fail closed). null = skip the budget check.
budget_file: null
# How long a failed Anthropic-backed call (4xx/5xx/quota) keeps the tier unavailable; a later success clears it.
failure_ttl_s: 300
# Limits for any CMA/A0 call site: a call that exceeds the timeout falls back to the core result; one session may not
# spend more than the budget (USD).
call_timeout_s: 150   # was 60: a five-contract assisted run takes about 57 s of agent turns (dev measurement), so 60 s left a 3 s margin; the route stays synchronous (app timeout 320 s)
session_budget_usd: 0.25

# --- A0 screening assistance (pravrudhi-app#125): every key below is read by application/a0_assist/config.py; a missing or malformed key keeps the route OFF (fail closed), never a default in code.
# Ship dark: the assisted route is enabled only when assist_route_enabled is true AND the product agent ids below are set AND the delete canary has passed.
assist_route_enabled: true   # on from 0.6.5 (Lead-2, 14 Oct): the product agent below exists; the delete canary and the store still gate every call
daily_ceiling_usd: 4.00
# Per-session budget is session_budget_usd (above). abandon_after_min: at least call_timeout_s + the interrupt wait + the delete time (store also keeps its own minimum).
abandon_after_min: 30
store_timeout_s: 3
max_concurrent_sessions: 2
# The product agent resource (NOT the research agent: the sweeper lists by this agent id, so a research session can never be returned). null until the product agent is created.
# Ids from the product-agent manifest MANIFEST_PRODUCT_agent_env.json (sha256 5fb55e20ceb3...; create_product_agent.py, 2026-10-14T09:52:58Z, model claude-sonnet-5-5). Ids only, no secrets.
agent_id: agent_012zKjNLSVQoivwTqEPBkVUZ
agent_version: 1
environment_id: env_01MAG6qEGC999A8r8MogP5bt
# One pinned agent per OTHER workflow (hearing_prep, intake), each {agent_id, agent_version, environment_id} from its own sha-pinned
# manifest. Empty = those workflows stay dark (the caller gets the ordinary result). Screening uses the three keys above.
# Ids from the sha-pinned manifests (ids only, no secrets; each agent has its own no-network environment; created 14 Oct, no session yet):
#   hearing_prep: MANIFEST_hearing_prep_agent.json sha256 ce5ac30c18d527ce...
#   intake:       MANIFEST_intake_agent_v2.json sha256 b250c43889b4fc5e... (v2 agent; the v1 agent is unused)
workflows:
  hearing_prep:
    agent_id: agent_01JvEU8nHU2JpQtUGEzrmmkX
    agent_version: 1
    environment_id: env_018P77Nk1DHCMD1tatmY4smL
  intake:
    agent_id: agent_019uQC3eQvCfo6viBX6xpErE
    agent_version: 1
    environment_id: env_01NqsSVpfUrUMX6PiS7fGG9W
# Names of environment variables (values arrive as RunPod secret references, never here).
workspace_id_env: ANTHROPIC_WORKSPACE_ID
store_dsn_env: SUPABASE_ASSIST_DB_URL
sweeper_dsn_env: SUPABASE_ASSIST_DB_URL_SWEEPER     # the sweeper's own narrow role (assist_sweeper_rpc)
# The store DSN (secret, env only) points at the session pooler on port 5432; its host name is part of the verified certificate.
store_ca_file: /opt/pravrudhi/certs/supabase-prod-ca.crt     # the database provider's public root CA, shipped in the hosted image at this path (sha pinned in the Dockerfile); a missing file means the store is not configured
# Anti-abuse (in memory, per worker; the store's daily ceiling is the hard stop).
assist_runs_per_user_per_day: 20
assist_runs_per_org_per_day: 100
assist_per_ip_per_minute: 5
# Retention (the notice states 2 hours): delete the Anthropic session after the result is read.
delete_after_run: true
retention_max_hours: 2
sweep_interval_min: 10
max_pending_deletes: 5
# One assisted run: at most this many events are read, and after the run the session gets this long to go idle before it is deleted.
max_events: 1000   # was 400: five contracts use about 230 stream events, ten would pass the old cap
interrupt_wait_s: 15
# Standing canary: hourly, and a canary older than 3 hours (or never run, or failed, or erroring) pauses the tier.
canary_interval_min: 60
canary_stale_min: 180
