# The /api/v1 partner API's own safety limits (LEG-PLAN-2026-09-23, reviewer 1's rejection of
# assistant/web/l4-analyse-facts@8344594). On the self-hosted 5090 deployment, auth is optional by design
# (application/identity.py's guard_boot only refuses an unauthenticated deploy on VERCEL/RENDER), so
# /api/v1/analyse-facts is callable by anyone with no other gate -- these two limits are that gate, not a
# secondary defense on top of one.

# Per-client-IP fixed-window limit on POST /api/v1/analyse-facts. A window's count resets at its own start,
# not a rolling average -- simple, and enough to stop one caller from burning the 5090's GPU time.
rate_limit_per_minute: 6

# Per-client-IP requests per minute for the OPTIONAL workflow routes (A1-A5, B3, S1-S3, bail draft), each with its own limiter; null = the number above.
# A preview user who adds four papers and then searches makes more than 6 calls in a minute. analyse-facts keeps the limit above.
slice_rate_limit_per_minute: 30

# Failed-key attempts per address per minute before further key checks from that address get 429 (#396). null = the same
# number as rate_limit_per_minute. Raise it (or set PRAVRUDHI_BAD_KEY_BUDGET_PER_MINUTE, which wins) when callers behind a gateway
# share one peer address and a flood of bad keys must not lock the valid keyed callers out; it does not change the anonymous limit.
bad_key_budget_per_minute: null

# The house judge is one vLLM server on one 5090 -- there is no queue depth that makes waiting sensible for
# an anonymous caller. A request that arrives once this many analyse-facts calls are already in flight gets
# a 503 immediately, never queued.
max_concurrent: 2

# Hard cap on distinct rate-limiter keys (IPs) held in memory at once -- real IP rotation must not grow
# this table without bound. LRU + stale-window eviction keeps it at or under this regardless of how many
# distinct callers actually show up.
rate_limit_max_keys: 10000

# Whether to trust an "X-Forwarded-For" header for the caller's IP (true only behind a proxy this
# deployment's own operator controls and that is known to set the header truthfully -- e.g. the Cloudflare
# tunnel in front of the hosted engine). False (the default) reads the raw socket peer address instead,
# which is correct for a direct connection and cannot be spoofed by the caller.
trust_proxy_header: false

# Which direct socket peers are trusted to set X-Forwarded-For truthfully -- the header itself is entirely
# client-controlled, so trust_proxy_header with an empty list here is refused at startup (a free rate-limit
# bypass otherwise: spoof a fresh header value per request). Only consulted when trust_proxy_header is
# true; e.g. ["127.0.0.1"] for a same-host reverse proxy, or the tunnel daemon's fixed local address.
trusted_proxies: []

# Per-client-IP fixed-window limit on the tenancy provisioning routes (POST /api/v1/orgs, and
# create/list/revoke under /api/v1/orgs/{org_id}/keys) -- deliberately much lower than
# rate_limit_per_minute above, since a wrong X-Pravrudhi-Tenancy-Secret guess against these routes is
# exactly the kind of call this exists to slow down, not a normal partner workload.
provision_rate_limit_per_minute: 10

# Issue #35: how long the second-judge circuit breaker stays open (shared for this process's whole
# lifetime, across every request) after a real timeout or connection failure. The breaker itself is always
# on -- it never changes an outcome, only how cheaply the fail-closed REFER path is reached once the second
# judge is down -- this only tunes the window. 60s default: long enough that a cold/down second judge
# doesn't cost every request in the next minute its own full timeout, short enough that a real recovery is
# noticed within a minute rather than papered over indefinitely.
second_judge_circuit_breaker_ttl_s: 60.0

# Off by default, and should stay off on a normal deployment: when true, a caller who ALSO passes
# ?debug_second_judge=true on a single /api/v1/analyse-facts request gets the config-C second judge's own
# diagnostic fields per element (p_established_second, tau_second, second_skip_reason,
# second_logit_distance, second_refer_band_fired, second_unavailable) -- this is a public, unauthenticated
# endpoint, so this deployment-level gate must be on BEFORE any caller's query param can do anything; a
# caller alone can never turn this on. NYAYA_DEBUG_SECOND_JUDGE_FIELDS env var overrides this per-deployment
# (2026-09-25, Lead-2's config-C smoke: diagnosing a primary/second disagreement needed a direct Python call
# because the HTTP response silently dropped every one of these fields).
debug_second_judge_fields_enabled: false

# Hours the hosted engine is open (the judges are parked outside them). GET /api/v1/status always reports
# this; analyse-facts refuses with 503 outside_service_window only when `enforce` is true. The hosted
# deployment turns enforcement on with PRAVRUDHI_SERVICE_WINDOW_ENFORCE=1; a local install leaves it off.
# Partner hours will change, so the window lives here and nowhere in code.
# 2026-10-14: the shipped window is open at every instant (`always_open: true`; open/close are display only). The live app disables its run buttons for signed-in users
# when /api/v1/status reports open_now=false (pravrudhi-app#180), and the engine does not enforce the window here, so
# a 09:00-21:00 window closed the buttons after 21:00 BST for nothing. Without `always_open` a same-day window needs
# `open` != `close`, so 00:00-23:59 would read closed from 23:59 to 00:00.
service_window:
  timezone: Europe/London
  open: "00:00"
  close: "23:59"
  always_open: true
  enforce: false

# Seconds after which GET /api/v1/status stops reporting the last analyse-facts judge observation and says
# "unknown" (the status is passive: it never probes the judge, so a stale reading is not a reading).
judge_seen_ttl_s: 600

# Serverless judges scale from zero (~2-3 min cold start). A judge failure with no fresh "ready" reading is
# reported as `judges_warming` (503 + Retry-After, status state "warming") for judge_warm_grace_s after the
# first such failure, then as a plain judge_unavailable. 0 turns the distinction off.
judge_warm_grace_s: 240
judge_warm_retry_s: 30

# Async jobs (POST /api/v1/analyse-facts/jobs, then poll GET .../jobs/{job_id}). Jobs are in memory and are lost on a
# restart. A finished job stays collectable for job_retention_s; one key may hold at most
# job_max_unfinished_per_key unfinished jobs (429 beyond that). Polling is not rate limited.
job_retention_s: 3600
job_max_unfinished_per_key: 8
# An accepted job (202) WAITS for a free agent slot (max_concurrent) up to this many seconds, then fails with
# agent_at_capacity. The synchronous route never waits (503 at once). 0 = jobs do not wait either.
job_slot_wait_s: 600

# Audit log (GET /api/v1/audit, the calling key's own rows only): one row per key-admitted analyse-facts call, with
# key id, time, run id, contract ids, outcome labels and HTTP status; never fact text. Rows older than this are
# dropped on write and never served (default 90 days).
audit_retention_s: 7776000

# #311: read each RunPod judge endpoint's /health before admitting a call, and answer 503 `judges_offline`
# at once when a needed judge is parked (no worker, nothing queued or in progress), so nothing is queued for the
# next warm. A failed or unreadable check proceeds as before. Local (non-RunPod) judges are never checked.
# LIMIT: an idle scale-from-zero endpoint (min 0, max above 0) looks the same on /health, so set this to false if a
# judge is ever put back on scale-from-zero. WARM WINDOW: an authorised warm sets min >= 1 (a worker is then up and the
# check reads ready) or turns this check off for that window, then waits about 5 s (judge_health_ttl_s) for the cache.
judge_health_check: true
judge_health_ttl_s: 5

# B3 (s.138 cheque checklist, flag wf_b3_s138_checklist): ON. Switch-on gate ALL_PASS 19 Oct 2026 (Track A, record
# nr_gate/runs/switchon_b3_4f27fff9/report.json sha12 87616d9255c1), R1 product_line_check 414fceaa631afe4e. The kill is
# this key false (or removed): the route is then a framework 404 again. Only the boolean true turns it on.
wf_b3_s138_checklist: true

# 0.6.23 switch-ons (19 Oct 2026; Lead-2 ruling). Evidence: Track A's switch-on gate (golden stage: flag-ON rows and, for the A2-reading slices,
# cross-tenant 404) ran ALL_PASS on engine fba3c2d5 on 19 Oct for A2, A3, A5, S1, S3, A4, A6, A7, A8 and B3; the other gate stages (deps, startup,
# saturate, smoke15, replay) run on the merged 0.6.23 tree before the swap, and a slice that fails there has its key set back to false. R2 signed
# the B3 package and the 17 Oct A2/A3/A5/S1/S3 pairs, and read the A4/A6/A7/A8 packages and results on 19 Oct. Only the boolean true turns a
# workflow on; the kill for any one is its key false (or removed) in a new image or after a restart, because the packaged config is authoritative.
wf_a2_span_index: true
# Lists the caller's own matters (POST /api/v1/matter-spans/my-matters: matter id and paper count; read-only, own organisation only; at most
# matter_spans_max_list_matters (50) matters and matter_spans_list_budget_s (30) seconds per listing, with `truncated` true when cut). The app's
# "Your matters" list is a separate build-time flag shipped in its own deploy. The kill is the key false (or removed) in a new image or after a
# restart, because the packaged config is authoritative. The gate records and the production list + delete test are on the release pull request.
wf_a2_list_matters: true
wf_a3_chronology: true
wf_a5_ingredient_agenda: true
wf_s1_matter_citation_sweep: true
wf_b2_quashing_agenda: true
wf_a6_cheque_case_check: true
wf_a7_matter_hearing_pack: true
# 0.6.24 switch-on of bail drafting (A4) and the synopsis and list of dates (A8). Both now require `sensitive_declaration` ("none" | "sensitive", no default):
# a request without it answers 422 after authentication, rate limits and the request-shape check, before consent, before any matter is read and before any
# model call. The fact-wording check behind the declaration is best effort. Both run template-only here (no drafting model is configured below). The gate,
# read and rerun records for this switch-on are on the release pull request; the app's drafting cards (NEXT_PUBLIC_DRAFTING_CARDS and
# NEXT_PUBLIC_SENSITIVE_DECLARATION, build-time) are deployed before these keys. The kill for either is its key false (or removed) in a new image or after a
# restart, because the packaged config is authoritative. A8 also needs A2 on and a store location (409 store_off / 503 store_unavailable otherwise).
wf_a8_synopsis_list_of_dates: true
wf_a4_bail_drafting: true
# #1015 scanned and garbled-page intake (OFF; the route wiring is a later PR). Calibrated by Track A on real Punjab and Haryana orders
# (record OCR_FLOOR_AND_GARBLED_RECORD v3 fe4253e57206; pinned tesseract 5.5.3 then recalibrated on 5.5.0, 300 dpi gray, --psm 3 tsv, English only): provisional,
# born-digital court PDFs with broken text layers, NOT partner phone photos. EVERY ocr_* key is required when the flag is true.
wf_c1_scanned_intake: false
ocr_min_page_confidence: 80
ocr_min_ink_coverage: 0.90
ocr_max_low_word_share: 0.10
ocr_low_word_confidence: 50
ocr_garbled_min_chars: 120
ocr_garbled_max_odd_token_share: 0.10
ocr_garbled_min_letter_share: 0.5
ocr_agreement_min_similarity: 0.80
ocr_max_pages: 60
ocr_page_timeout_s: 30
ocr_document_deadline_s: 120
ocr_dpi: 300
# The calibrated engine: scanned intake uses no other tesseract build or English data. The engine image must carry exactly this build, or
# these two values change together with a new calibration. Recalibrated on the engine image's own tesseract (Debian 5.5.0, 20 Oct): the same
# floor and detector decisions as the 5.5.3 build on all 288 real pages, and the English data is byte-identical (same sha256 below).
ocr_tesseract_version: "5.5.0"
ocr_eng_traineddata_sha256: "7d4322bd2a7749724879683fc3912cb542f19906c83bcc1a52132556427170b2"
ocr_languages: eng
