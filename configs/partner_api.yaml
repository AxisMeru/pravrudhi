# The /api/v1 partner API's own safety limits (LEG-PLAN-2026-09-23, reviewer 1's rejection of
# assistant/web/l4-analyse-facts@8344594). On the self-hosted 5090 deployment, auth is optional by design
# (application/identity.py's guard_boot only refuses an unauthenticated deploy on VERCEL/RENDER), so
# /api/v1/analyse-facts is callable by anyone with no other gate -- these two limits are that gate, not a
# secondary defense on top of one.

# Per-client-IP fixed-window limit on POST /api/v1/analyse-facts. A window's count resets at its own start,
# not a rolling average -- simple, and enough to stop one caller from burning the 5090's GPU time.
rate_limit_per_minute: 6

# The house judge is one vLLM server on one 5090 -- there is no queue depth that makes waiting sensible for
# an anonymous caller. A request that arrives once this many analyse-facts calls are already in flight gets
# a 503 immediately, never queued.
max_concurrent: 2

# Hard cap on distinct rate-limiter keys (IPs) held in memory at once -- real IP rotation must not grow
# this table without bound. LRU + stale-window eviction keeps it at or under this regardless of how many
# distinct callers actually show up.
rate_limit_max_keys: 10000

# Whether to trust an "X-Forwarded-For" header for the caller's IP (true only behind a proxy this
# deployment's own operator controls and that is known to set the header truthfully -- e.g. the Cloudflare
# tunnel in front of the hosted engine). False (the default) reads the raw socket peer address instead,
# which is correct for a direct connection and cannot be spoofed by the caller.
trust_proxy_header: false

# Which direct socket peers are trusted to set X-Forwarded-For truthfully -- the header itself is entirely
# client-controlled, so trust_proxy_header with an empty list here is refused at startup (a free rate-limit
# bypass otherwise: spoof a fresh header value per request). Only consulted when trust_proxy_header is
# true; e.g. ["127.0.0.1"] for a same-host reverse proxy, or the tunnel daemon's fixed local address.
trusted_proxies: []

# Per-client-IP fixed-window limit on the tenancy provisioning routes (POST /api/v1/orgs, and
# create/list/revoke under /api/v1/orgs/{org_id}/keys) -- deliberately much lower than
# rate_limit_per_minute above, since a wrong X-Pravrudhi-Tenancy-Secret guess against these routes is
# exactly the kind of call this exists to slow down, not a normal partner workload.
provision_rate_limit_per_minute: 10

# Issue #35: how long the second-judge circuit breaker stays open (shared for this process's whole
# lifetime, across every request) after a real timeout or connection failure. The breaker itself is always
# on -- it never changes an outcome, only how cheaply the fail-closed REFER path is reached once the second
# judge is down -- this only tunes the window. 60s default: long enough that a cold/down second judge
# doesn't cost every request in the next minute its own full timeout, short enough that a real recovery is
# noticed within a minute rather than papered over indefinitely.
second_judge_circuit_breaker_ttl_s: 60.0

# Off by default, and should stay off on a normal deployment: when true, a caller who ALSO passes
# ?debug_second_judge=true on a single /api/v1/analyse-facts request gets the config-C second judge's own
# diagnostic fields per element (p_established_second, tau_second, second_skip_reason,
# second_logit_distance, second_refer_band_fired, second_unavailable) -- this is a public, unauthenticated
# endpoint, so this deployment-level gate must be on BEFORE any caller's query param can do anything; a
# caller alone can never turn this on. NYAYA_DEBUG_SECOND_JUDGE_FIELDS env var overrides this per-deployment
# (2026-09-25, Lead-2's config-C smoke: diagnosing a primary/second disagreement needed a direct Python call
# because the HTTP response silently dropped every one of these fields).
debug_second_judge_fields_enabled: false
