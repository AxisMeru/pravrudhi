# Two Workers from one script: `wrangler deploy --env studio` and `wrangler deploy --env product`.
# KV_NAMESPACE_ID is filled by run_gateway.sh --setup (it creates the namespace once and writes the id to
# ~/.config/pravrudhi/cloudflare.env as CF_KV_ID); the account comes from CLOUDFLARE_ACCOUNT_ID in that file.
name = "pravrudhi-gateway"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = true

[env.studio]
name = "pravrudhi-studio"
vars = { EDITION = "studio", ENGINE_KEY = "engine_url_studio" }
kv_namespaces = [{ binding = "KV", id = "KV_NAMESPACE_ID" }]

[env.product]
name = "pravrudhi-app"
vars = { EDITION = "product", ENGINE_KEY = "engine_url_product" }
kv_namespaces = [{ binding = "KV", id = "KV_NAMESPACE_ID" }]

# Staging only, deployed from this scratch worktree, never the live gateway checkout
# (/home/ss/projects/pravrudhi) -- `wrangler deploy --env staging` only. Same KV namespace as
# studio/product (one namespace, distinct keys per ENGINE_KEY), so the real id is required here;
# studio/product above stay on the placeholder deliberately, so this file can never accidentally
# redeploy production if the wrong --env is passed from this worktree.
[env.staging]
name = "pravrudhi-app-staging"
vars = { EDITION = "product", ENGINE_KEY = "engine_url_staging", UPSTREAM_KIND = "runpod", PRAVRUDHI_VERSION = "0.5.29" }
kv_namespaces = [{ binding = "KV", id = "4486cc4e4cb4474a8db0d92768006f20" }]
